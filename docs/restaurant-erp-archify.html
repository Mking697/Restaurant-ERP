<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant HQ ERP — System Guide</title>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}html{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#475569;--border:#cbd5e1;--accent:#2563eb;--tag:#e2e8f0}html[data-theme=dark]{color-scheme:dark;--bg:#020617;--card:#0f172a;--text:#e2e8f0;--muted:#a5b4c8;--border:#334155;--accent:#60a5fa;--tag:#1e293b}html[data-theme=blue]{--bg:#eff6ff;--card:#fff;--text:#172554;--muted:#1e40af;--border:#93c5fd;--accent:#1d4ed8;--tag:#dbeafe}html[data-theme=emerald]{--bg:#ecfdf5;--card:#fff;--text:#022c22;--muted:#065f46;--border:#6ee7b7;--accent:#047857;--tag:#d1fae5}header,main,footer{max-width:1200px;margin:auto;padding:24px}header{text-align:center;padding-top:40px}h1{font-size:clamp(24px,4vw,36px);line-height:1.2}h2{font-size:20px}p{color:var(--muted)}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}.controls label{display:flex;align-items:center;gap:8px}select,button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px}button,select{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.notice,.flow{padding:16px;border:1px solid var(--border);border-radius:12px;background:var(--card);margin:18px 0}.flow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px}.card{padding:20px;text-align:left;border-top:4px solid var(--accent);transition:transform .15s}.card:hover{transform:translateY(-3px)}.card h3{margin:12px 0 8px;font-size:17px}.card p{font-size:13px}.meta{display:flex;justify-content:space-between;align-items:center;gap:8px}.icon{font-size:26px}.badge{background:var(--tag);padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700}.live{color:#065f46;background:#d1fae5}.demo{color:#92400e;background:#fef3c7}.tap{color:var(--accent);font-size:12px}.category{font-size:11px;color:var(--muted)}dialog{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:16px;max-width:680px;width:calc(100% - 32px);max-height:85vh;padding:28px}dialog::backdrop{background:#020617b3}dialog p,dialog li{color:var(--muted)}dialog h3{color:var(--accent);font-size:13px;text-transform:uppercase;letter-spacing:.04em}.close{float:right}.route{font:12px monospace;color:var(--accent)}.example{padding:14px;background:var(--tag);border-radius:8px}.foot{font-size:12px;text-align:center}li{margin-bottom:8px}@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style></head><body><header><h1>🍽️ Restaurant HQ ERP</h1><p id="subtitle"></p><div class="controls"><label><span id="languageLabel"></span><select id="language" aria-label="Language"><option value="en">English</option><option value="hinglish">Hinglish</option></select></label><label><span id="themeLabel"></span><select id="theme" aria-label="Theme"><option value="light">Light</option><option value="dark">Dark</option><option value="blue">Blue</option><option value="emerald">Emerald</option></select></label></div></header><main><section class="notice"><h2 id="statusTitle"></h2><p id="status"></p><p id="preferences"></p><p id="permissions"></p></section><div class="flow" id="flow"></div><p id="flowNote"></p><div class="grid" id="grid"></div></main><dialog id="detail"><button class="close" id="close" type="button"></button><div id="detailContent"></div></dialog><footer class="foot" id="footer"></footer>
<script>
const MODULES = [{"module": "DASHBOARD_OWNER", "route": "/dashboard", "icon": "📊", "cat": "frontend", "status": "pending", "title": "Owner Dashboard", "short": "Sample branch KPIs and charts; not live business totals.", "what": "Compare illustrative sales, inventory value, prime cost, overdue tasks and MIS scores. Branch filtering is a demo presentation filter, not evidence of database isolation.", "how": ["Select a branch or the compiled view in the branch selector.", "Review KPI cards, revenue charts, channel mix and the branch table.", "Use Guide Book for workflow details. Dashboard metrics remain sample data, even when Inventory has real stock."], "example": "Illustration: a sample branch shows ₹1,42,500 revenue and four overdue tasks. Do not use these values for business decisions.", "hinglish": {"title": "Owner Dashboard", "short": "Sample branch KPIs aur charts; live business totals nahi.", "what": "Sample sales, inventory value, prime cost, overdue tasks aur MIS compare karo. Branch filter sirf demo presentation hai, database isolation ka proof nahi.", "how": ["Branch selector se branch ya compiled view chuno.", "KPI cards, revenue charts, channel mix aur branch table dekho.", "Workflow details ke liye Guide Book kholo. Inventory real hone par bhi dashboard sample data hi hai."], "example": "Example: sample branch mein ₹1,42,500 revenue aur chaar overdue tasks hain. In numbers se business decisions mat lo."}}, {"module": "REPORTS", "route": "/reports", "icon": "📑", "cat": "frontend", "status": "pending", "title": "Reports", "short": "Six sample reports with charts, tables and CSV export.", "what": "Sales Trend, MIS Scorecard, Food Cost & Menu Margin, Inventory Variance, Cash Reconciliation and Aggregator Reconciliation use mock datasets. They are not connected to live transactions.", "how": ["Open a report card.", "Review its charts and table.", "Export CSV downloads the same sample dataset for spreadsheet review."], "example": "Illustration: a ₹420 dish with a sample ₹138 ingredient cost appears in Food Cost. These are demo values, not a verified recipe cost.", "hinglish": {"title": "Reports", "short": "Charts, tables aur CSV export ke saath chhe sample reports.", "what": "Sales Trend, MIS, Food Cost, Inventory Variance, Cash aur Aggregator reports mock data use karti hain. Live transactions connected nahi hain.", "how": ["Report card kholo.", "Charts aur table dekho.", "Export CSV se wahi sample dataset spreadsheet ke liye download hota hai."], "example": "Example: ₹420 ki dish aur ₹138 sample ingredient cost Food Cost mein dikhti hai. Yeh demo values hain, verified recipe cost nahi."}}, {"module": "MIS_PERFORMANCE", "route": "/performance", "icon": "🏆", "cat": "frontend", "status": "pending", "title": "MIS Leaderboard", "short": "Illustrative staff rankings, completion counts and weighted scores.", "what": "The displayed task/delegation/variance/cashier weighting is 40/30/20/10. Scores and timestamps are sample data; live score calculation is pending.", "how": ["Compare On Time, Delay and Not Done counts.", "Review the score chart and table.", "Export CSV to inspect the illustrative rankings."], "example": "Illustration: Rahul’s sample score is 93.1%. It is not an assessment of a real employee.", "hinglish": {"title": "MIS Leaderboard", "short": "Staff ranking, completion counts aur weighted score ka demo.", "what": "Task/delegation/variance/cashier weighting 40/30/20/10 dikhayi gayi hai. Scores aur timestamps sample hain; live calculation pending hai.", "how": ["On Time, Delay aur Not Done counts compare karo.", "Score chart aur table dekho.", "Sample ranking inspect karne ke liye Export CSV use karo."], "example": "Example: Rahul ka sample score 93.1% hai. Yeh kisi real employee ka assessment nahi."}}, {"module": "TASKS_DELEGATION", "route": "/tasks", "icon": "✅", "cat": "frontend", "status": "pending", "title": "Tasks & Checklists", "short": "Try recurring checklists and one-time task delegation.", "what": "This interactive demo keeps tasks in browser page state. Reloading resets changes. Automatic recurrence, reminders, file upload storage and task persistence are not connected.", "how": ["Create a recurring checklist with title, branch, doer, frequency and shift time.", "Delegate a one-time task with priority and due time.", "Mark Done: evidence selection is optional for recurring tasks and required for delegation. Only the selected file name is retained, not an uploaded file."], "example": "Illustration: create a fridge-check task, then mark it Done. Reloading removes your demo changes; no recurring schedule was created.", "hinglish": {"title": "Tasks & Checklists", "short": "Recurring checklist aur one-time delegation try karo.", "what": "Demo tasks browser page state mein rehte hain. Reload par changes reset hote hain. Auto recurrence, reminders, file storage aur task persistence connected nahi hain.", "how": ["Title, branch, doer, frequency aur shift time se recurring checklist banao.", "Priority aur due time se one-time task saunpo.", "Mark Done mein recurring evidence optional aur delegation evidence zaroori hai. Sirf selected file ka naam rehta hai, file upload nahi hoti."], "example": "Example: fridge-check task banao aur Done karo. Reload par changes hat jaayenge; recurring schedule create nahi hua."}}, {"module": "INVENTORY", "route": "/inventory", "icon": "📦", "cat": "backend", "status": "live", "title": "Inventory", "short": "Real branch stock, units, minimum/maximum levels and alerts.", "what": "Stock records are saved in PostgreSQL. Material names share a common catalog, but quantities and alert levels belong to individual branches. Owner can view all branches; permitted branch staff operate within their own branch.", "how": ["Choose a permitted branch and review stock.", "Add Item: enter name, branch, unit, opening quantity and minimum/maximum levels.", "An existing catalog name reuses its material/unit. Below minimum shows Low stock; above a positive maximum shows Overstock.", "This screen does not create purchase indents or manage expiry batches."], "example": "Illustration: Chicken at 9 kg against a 20 kg minimum shows Low stock for that branch. Adding stock does not change another branch’s record.", "hinglish": {"title": "Inventory", "short": "Real branch stock, units, min/max levels aur alerts.", "what": "Stock PostgreSQL mein save hota hai. Material catalog common hai, par quantity aur alert levels har branch ke alag hain. Owner sab branches dekh sakta hai; permitted branch staff sirf apni branch mein kaam karte hain.", "how": ["Permitted branch chuno aur stock dekho.", "Add Item mein naam, branch, unit, opening qty aur min/max bharo.", "Existing catalog naam par wahi material/unit use hoti hai. Minimum se kam par Low stock; positive maximum se zyada par Overstock aata hai.", "Is screen se purchase indent nahi banti aur expiry batches manage nahi hote."], "example": "Example: Chicken 9 kg aur minimum 20 kg ho to us branch mein Low stock dikhta hai. Doosri branch ka stock nahi badalta."}}, {"module": "PURCHASE_ORDER", "route": "/purchase", "icon": "🛒", "cat": "backend", "status": "pending", "title": "Purchase & GRN", "short": "Interactive indent, purchase and quality-check demo.", "what": "Try the workflow without posting real purchases. Indents, POs and GRNs are page-local mock records. Quality decisions do not update live Inventory, create vendor returns or post Accounts refunds.", "how": ["Raise an indent, submit for approval, then approve or reject it.", "Create a store or general purchase. Try Buy, optional Bill Upload and Material Receive.", "Open the GRN quality check and choose Pass, Fail or Partial. The result is a demo only; no stock/refund posting occurs."], "example": "Illustration: mark a demo GRN Partial with 2 kg failed. Its row changes, but live inventory and accounts remain unchanged.", "hinglish": {"title": "Purchase & GRN", "short": "Indent, purchase aur quality-check ka interactive demo.", "what": "Real purchase post kiye bina workflow try karo. Indents, POs aur GRNs page-local mock records hain. Quality decision se live Inventory, vendor return ya Accounts refund nahi banta.", "how": ["Indent banao, approval ke liye bhejo, phir approve/reject karo.", "Store ya general purchase banao. Buy, optional Bill Upload aur Material Receive try karo.", "GRN quality check mein Pass, Fail ya Partial chuno. Sirf demo result hai; stock/refund posting nahi hoti."], "example": "Example: demo GRN Partial karo aur 2 kg failed bharo. Row badlegi, par live inventory aur accounts nahi badlenge."}}, {"module": "POS_CASHIER", "route": "/pos", "icon": "💳", "cat": "frontend", "status": "pending", "title": "POS / Cashier", "short": "Create sample order headers across dine-in and delivery channels.", "what": "Orders use mock page state, not a live billing ledger. Line items, payment collection, invoice posting and database persistence are not implemented.", "how": ["New Order: enter branch, channel, table if applicable, amount and tender.", "Create Order adds a row to this page.", "Reload to restore the original sample dataset."], "example": "Illustration: enter a ₹1,840 dine-in order paid by UPI. The demo row is not a real bill or payment receipt.", "hinglish": {"title": "POS / Cashier", "short": "Dine-in aur delivery channels ke sample order headers banao.", "what": "Orders mock page state use karte hain, live billing ledger nahi. Line items, payment collection, invoice posting aur database persistence implement nahi hain.", "how": ["New Order mein branch, channel, table (agar ho), amount aur tender bharo.", "Create Order se is page par row aati hai.", "Reload par original sample dataset wapas aata hai."], "example": "Example: ₹1,840 ka dine-in order UPI tender se bharo. Demo row real bill ya payment receipt nahi hai."}}, {"module": "CASH_DROP", "route": "/cash-drop", "icon": "🔒", "cat": "frontend", "status": "pending", "title": "Blind Cash Drop", "short": "Count denominations and submit an illustrative closing total.", "what": "The page totals notes and coins locally. No expected-cash API, saved cash-drop record or shortage/excess calculation is connected yet. Do not treat demo submission as shift closure.", "how": ["Enter counts for each note denomination.", "Add the total coin value.", "Submit Cash Drop to see the counted total. Reloading resets it."], "example": "Illustration: a counted ₹18,350 is displayed after submission. No shortage is calculated and no closing entry is saved.", "hinglish": {"title": "Blind Cash Drop", "short": "Notes aur coins gino aur sample closing total submit karo.", "what": "Page notes aur coins locally total karta hai. Expected-cash API, saved cash-drop record aur shortage/excess calculation connected nahi hain. Demo submission ko shift closure mat samjho.", "how": ["Har denomination ke notes ki ginti bharo.", "Coins ki total value bharo.", "Submit Cash Drop se counted total dekho. Reload par reset hota hai."], "example": "Example: submission ke baad gina hua ₹18,350 dikhta hai. Shortage calculate ya closing entry save nahi hoti."}}, {"module": "PETTY_CASH", "route": "/accounts", "icon": "💰", "cat": "finance", "status": "pending", "title": "Accounts", "short": "Sample cash book, aggregator reconciliation and financial statements.", "what": "Petty Cash Book, Aggregator Recon, Profit & Loss and Balance Sheet are demonstrations. Cash entries change this page’s running balance only. No ledger entry or financial posting is persisted.", "how": ["Choose a tab to inspect the sample data.", "Petty Cash Entry: choose IN for top-up/refund or OUT for expense, then enter the branch, amount and description.", "Treat balance-sheet equality and profit figures as illustrative, not audited statements."], "example": "Illustration: add a ₹500 OUT expense. The page balance changes; reloading restores sample data and no real expense was posted.", "hinglish": {"title": "Accounts", "short": "Sample cash book, aggregator reconciliation aur financial statements.", "what": "Petty Cash Book, Aggregator Recon, P&L aur Balance Sheet demo hain. Cash entry sirf page ka running balance badalti hai. Real ledger ya financial posting save nahi hoti.", "how": ["Sample data dekhne ke liye tab chuno.", "Petty Cash Entry mein top-up/refund ke liye IN ya expense ke liye OUT chuno, phir branch, amount aur description bharo.", "Balance-sheet equality aur profit figures sirf examples hain, audited statements nahi."], "example": "Example: ₹500 OUT expense jodo. Page balance badlega; reload par sample data aayega aur real expense post nahi hua."}}, {"module": "USER_ADMIN", "route": "/admin/users", "icon": "👥", "cat": "admin", "status": "live", "title": "Users & Access", "short": "Create real users with roles, branch assignment and module grants.", "what": "Owner manages all branches and HQ roles. Branch Admin manages only own-branch users and cannot grant more access than they hold, edit themselves or create HQ roles. Server-side permissions govern real records.", "how": ["New User: enter name, 10-digit mobile number (without +91), a password of at least 12 characters, role and branch.", "Select allowed module grants and save. Branch Admin sees only delegable grants.", "Edit a user to change access/status/password. Saved changes revoke the user’s existing sessions; blank password retains the existing password."], "example": "Illustration: give a cashier only POS and Cash Drop grants. Other modules remain inaccessible; grants do not make demo modules database-backed.", "hinglish": {"title": "Users & Access", "short": "Real users banao: role, branch aur module grants ke saath.", "what": "Owner sab branches aur HQ roles manage karta hai. Branch Admin sirf apni branch ke users manage karta hai; apne se zyada grants nahi de sakta, khud ko edit ya HQ role create nahi kar sakta. Server permissions real records par lagti hain.", "how": ["New User mein naam, 10-digit mobile number (without +91), kam se kam 12-character password, role aur branch bharo.", "Allowed module grants chuno aur save karo. Branch Admin ko sirf delegable grants dikhte hain.", "Edit se access/status/password badlo. Save par purane sessions revoke hote hain; blank password par purana password rehta hai."], "example": "Example: cashier ko sirf POS aur Cash Drop grants do. Doosre modules accessible nahi honge; grants demo modules ko DB-backed nahi banate."}}, {"module": "BRANCH_ADMIN", "route": "/admin/branches", "icon": "🏢", "cat": "admin", "status": "live", "title": "Branches", "short": "Real branch records; only Owner creates branches.", "what": "Owner can create and edit branches. Branch Admin sees and maintains only their own branch. Creating a branch does not clone menus, recipes, checklists or stock. The clone wizard is not implemented.", "how": ["Owner: New Branch, then enter code, name, address, coordinates and geofence radius.", "Edit a permitted row and save. The screen reads the saved record back from PostgreSQL.", "New branches start empty. Branch deletion is not offered by this screen."], "example": "Illustration: Owner creates B7 — Vasant Kunj. It becomes a real branch option in user administration; no menu or stock is copied.", "hinglish": {"title": "Branches", "short": "Real branch records; sirf Owner nayi branch banata hai.", "what": "Owner branches create/edit kar sakta hai. Branch Admin sirf apni branch dekhta aur maintain karta hai. Branch banane se menu, recipes, checklist ya stock clone nahi hote. Clone wizard implement nahi hai.", "how": ["Owner: New Branch mein code, naam, address, coordinates aur geofence radius bharo.", "Permitted row Edit karke save karo. Screen PostgreSQL se saved record dobara padhti hai.", "Nayi branch khali shuru hoti hai. Is screen par branch delete option nahi hai."], "example": "Example: Owner B7 — Vasant Kunj banata hai. User administration mein real branch option aata hai; menu ya stock copy nahi hota."}}, {"module": "WHATSAPP_LOGS", "route": "/admin/settings/whatsapp", "icon": "📲", "cat": "whatsapp", "status": "live", "title": "WhatsApp Settings (ChatXFlow)", "short": "Owner-only provider configuration saved in the real database.", "what": "Connect a number in ChatXFlow, then save the provider token, phone and pinned base URL here. Saving credentials does not enable task reminders, approval messages, 8AM summaries or inbound webhooks; these automation workflows are still pending.", "how": ["Owner: connect the WhatsApp number using ChatXFlow’s own QR flow.", "Paste the Developer API Token and set the WhatsApp phone number.", "Save Settings. Leave the token blank to retain an existing saved token. Custom hosts are not allowed."], "example": "Illustration: Owner saves provider settings. This proves configuration storage only, not automatic delivery of task reminders or approval buttons.", "hinglish": {"title": "WhatsApp Settings (ChatXFlow)", "short": "Owner-only provider configuration real database mein save hoti hai.", "what": "ChatXFlow mein number connect karo, phir provider token, phone aur fixed base URL yahan save karo. Credentials save karne se task reminders, approval messages, 8AM summary ya inbound webhooks enable nahi hote; yeh automation pending hain.", "how": ["Owner: ChatXFlow ke apne QR flow se WhatsApp number connect karo.", "Developer API Token paste karo aur WhatsApp phone number set karo.", "Save Settings dabao. Existing token rakhne ke liye token blank chhodo. Custom hosts allowed nahi hain."], "example": "Example: Owner provider settings save karta hai. Isse sirf configuration storage verify hoti hai, automatic reminders ya approval buttons ki delivery nahi."}}];
const COPY = {
subtitle:["Open a module for its purpose, exact steps and illustrative example. This self-contained guide also works offline.","Module kholo: uska kaam, steps aur example samjho. Yeh self-contained guide offline bhi chalti hai."],
languageLabel:["Language","Bhasha"], themeLabel:["Theme","Theme"], statusTitle:["Implementation status: 4 Live DB · 8 interactive demos","Implementation status: 4 Live DB · 8 interactive demos"],
status:["Live DB: Inventory, Users & Access, Branches and WhatsApp Settings use PostgreSQL with real access control. Dashboard, Reports, MIS, Tasks, Purchase, POS, Cash Drop and Accounts are interactive demos using mock data. Changes on those pages reset on reload and do not create real transactions, stock movements, returns or refunds.","Live DB: Inventory, Users & Access, Branches aur WhatsApp Settings PostgreSQL aur real access control use karte hain. Dashboard, Reports, MIS, Tasks, Purchase, POS, Cash Drop aur Accounts mock-data wale interactive demos hain. In pages ke changes reload par reset hote hain; real transaction, stock movement, return ya refund nahi banta."],
preferences:["Sign in to the app with a 10-digit mobile number, without +91. English is the default language. Choose Hinglish and Light, Dark, Blue or Emerald using the selectors. This guide remembers its own preferences in this browser; app preferences are separate. If browser storage is unavailable, the controls still work for this visit.","App login mein sirf 10-digit mobile number bharo, +91 nahi. English default language hai. Selectors se Hinglish aur Light, Dark, Blue ya Emerald chuno. Yeh guide isi browser mein apni preferences yaad rakhti hai; app preferences alag hain. Browser storage unavailable ho tab bhi controls is visit mein kaam karte hain."],
permissions:["In the app, Owner manages all branches; Branch Admin manages only their own branch and cannot delegate grants they do not hold. Staff need their own branch and module/action permission. This offline guide lists all modules for reference and does not grant app access.","App mein Owner sab branches manage karta hai; Branch Admin sirf apni branch aur apne grants ke andar kaam karta hai. Staff ko apni branch aur module/action permission chahiye. Offline guide reference ke liye sab modules dikhati hai; app access nahi deti."],
flowNote:["Architecture overview only: provider configuration is saved, but automatic reminders, approval buttons, inbound webhooks and the 8AM summary remain pending. Saving a token is not proof of message delivery.","Sirf architecture overview: provider configuration save hoti hai, par auto reminders, approval buttons, inbound webhooks aur 8AM summary pending hain. Token save hona message delivery ka proof nahi."],
footer:["Restaurant HQ ERP · Six example branches, scalable by branch ID. Illustrative examples are not real business records.","Restaurant HQ ERP · Chhe example branches, branch ID se scalable. Examples real business records nahi hain."],
close:["Close","Band karein"],what:["What is it?","Yeh kya hai?"],how:["How to use it?","Kaise use karein?"],example:["Illustrative example","Samajhne ke liye example"],tap:["Open the full guide →","Puri guide kholein →"],live:["Live DB","Real DB"],demo:["Demo · not saved","Demo · save nahi hota"]};
const CATS={frontend:["Daily Operations","Roz ka kaam"],backend:["Purchase / Stock","Purchase / Stock"],finance:["Finance","Finance"],admin:["Admin / Setup","Admin / Setup"],whatsapp:["WhatsApp Connection","WhatsApp Connection"]};
let language="en", theme="light", openKey=null;
try { const l=localStorage.getItem("restaurant-guide-language"); if(["en","hinglish"].includes(l)) language=l; const th=localStorage.getItem("restaurant-guide-theme"); if(["light","dark","blue","emerald"].includes(th))theme=th;}catch{}
const el=id=>document.getElementById(id), tx=pair=>pair[language==="hinglish"?1:0];
function node(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n;}
function chapter(m){return language==="hinglish"?{...m,...m.hinglish}:m;}
function renderDetail(){if(!openKey)return;const base=MODULES.find(m=>m.module===openKey),m=chapter(base), target=el("detailContent");target.replaceChildren(node("div",m.route,"route"),node("h2",m.icon+" "+m.title),node("span",tx(COPY[m.status==="live"?"live":"demo"]),"badge "+(m.status==="live"?"live":"demo")),node("h3",tx(COPY.what)),node("p",m.what),node("h3",tx(COPY.how)));const ul=node("ul","");m.how.forEach(s=>ul.append(node("li",s)));target.append(ul,node("h3",tx(COPY.example)),node("p",m.example,"example"));}
function render(){document.documentElement.lang=language==="hinglish"?"hi-Latn":"en";document.documentElement.dataset.theme=theme;el("language").value=language;el("theme").value=theme;["subtitle","languageLabel","themeLabel","statusTitle","status","preferences","permissions","flowNote","footer","close"].forEach(id=>el(id).textContent=tx(COPY[id]));el("close").setAttribute("aria-label",tx(COPY.close));el("flow").replaceChildren();[tx(["Staff WhatsApp (planned workflows)","Staff WhatsApp (planned workflows)"]),"→","ChatXFlow API","→","Restaurant HQ ERP","→","PostgreSQL","→",tx(["Owner view","Owner view"])].forEach(s=>el("flow").append(node("span",s)));el("grid").replaceChildren();MODULES.forEach(base=>{const m=chapter(base),b=node("button","","card");b.type="button";const meta=node("div","","meta");meta.append(node("span",m.icon,"icon"),node("span",tx(COPY[m.status==="live"?"live":"demo"]),"badge "+(m.status==="live"?"live":"demo")));b.append(meta,node("h3",m.title),node("div",tx(CATS[m.cat]),"category"),node("p",m.short),node("span",tx(COPY.tap),"tap"));b.onclick=()=>{openKey=m.module;renderDetail();el("detail").showModal();};el("grid").append(b);});renderDetail();}
el("language").onchange=e=>{language=e.target.value;try{localStorage.setItem("restaurant-guide-language",language)}catch{}render();};el("theme").onchange=e=>{theme=e.target.value;try{localStorage.setItem("restaurant-guide-theme",theme)}catch{}render();};el("close").onclick=()=>el("detail").close();el("detail").addEventListener("close",()=>{openKey=null;});render();
</script></body></html>
