<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant HQ ERP — System Guide</title>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}html{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#475569;--border:#cbd5e1;--accent:#2563eb;--tag:#e2e8f0}html[data-theme=dark]{color-scheme:dark;--bg:#020617;--card:#0f172a;--text:#e2e8f0;--muted:#a5b4c8;--border:#334155;--accent:#60a5fa;--tag:#1e293b}html[data-theme=blue]{--bg:#eff6ff;--card:#fff;--text:#172554;--muted:#1e40af;--border:#93c5fd;--accent:#1d4ed8;--tag:#dbeafe}html[data-theme=emerald]{--bg:#ecfdf5;--card:#fff;--text:#022c22;--muted:#065f46;--border:#6ee7b7;--accent:#047857;--tag:#d1fae5}header,main,footer{max-width:1200px;margin:auto;padding:24px}header{text-align:center;padding-top:40px}h1{font-size:clamp(24px,4vw,36px);line-height:1.2}h2{font-size:20px}p{color:var(--muted)}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}.controls label{display:flex;align-items:center;gap:8px}select,button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px}button,select{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.notice,.flow{padding:16px;border:1px solid var(--border);border-radius:12px;background:var(--card);margin:18px 0}.flow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px}.card{padding:20px;text-align:left;border-top:4px solid var(--accent);transition:transform .15s}.card:hover{transform:translateY(-3px)}.card h3{margin:12px 0 8px;font-size:17px}.card p{font-size:13px}.meta{display:flex;justify-content:space-between;align-items:center;gap:8px}.icon{font-size:26px}.badge{background:var(--tag);padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700}.live{color:#065f46;background:#d1fae5}.demo{color:#92400e;background:#fef3c7}.tap{color:var(--accent);font-size:12px}.category{font-size:11px;color:var(--muted)}dialog{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:16px;max-width:680px;width:calc(100% - 32px);max-height:85vh;padding:28px}dialog::backdrop{background:#020617b3}dialog p,dialog li{color:var(--muted)}dialog h3{color:var(--accent);font-size:13px;text-transform:uppercase;letter-spacing:.04em}.close{float:right}.route{font:12px monospace;color:var(--accent)}.example{padding:14px;background:var(--tag);border-radius:8px}.foot{font-size:12px;text-align:center}li{margin-bottom:8px}@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style></head><body><header><h1>🍽️ Restaurant HQ ERP</h1><p id="subtitle"></p><div class="controls"><label><span id="languageLabel"></span><select id="language" aria-label="Language"><option value="en">English</option><option value="hinglish">Hinglish</option></select></label><label><span id="themeLabel"></span><select id="theme" aria-label="Theme"><option value="light">Light</option><option value="dark">Dark</option><option value="blue">Blue</option><option value="emerald">Emerald</option></select></label></div></header><main><section class="notice"><h2 id="statusTitle"></h2><p id="status"></p><p id="preferences"></p><p id="permissions"></p><h2 id="brandingTitle"></h2><ol id="brandingSteps"></ol></section><div class="flow" id="flow"></div><p id="flowNote"></p><div class="grid" id="grid"></div></main><dialog id="detail"><button class="close" id="close" type="button"></button><div id="detailContent"></div></dialog><footer class="foot" id="footer"></footer>
<script>
const MODULES = [{"module": "DASHBOARD_OWNER", "route": "/dashboard", "icon": "📊", "cat": "frontend", "status": "pending", "title": "Owner Dashboard", "short": "Sample branch KPIs and charts; not live business totals.", "what": "Compare illustrative sales, inventory value, prime cost, overdue tasks and MIS scores. Branch filtering is a demo presentation filter, not evidence of database isolation.", "how": ["Select a branch or the compiled view in the branch selector.", "Review KPI cards, revenue charts, channel mix and the branch table.", "Use Guide Book for workflow details. Dashboard metrics remain sample data, even when Inventory has real stock."], "example": "Illustration: a sample branch shows ₹1,42,500 revenue and four overdue tasks. Do not use these values for business decisions.", "hinglish": {"title": "Owner Dashboard", "short": "Sample branch KPIs aur charts; live business totals nahi.", "what": "Sample sales, inventory value, prime cost, overdue tasks aur MIS compare karo. Branch filter sirf demo presentation hai, database isolation ka proof nahi.", "how": ["Branch selector se branch ya compiled view chuno.", "KPI cards, revenue charts, channel mix aur branch table dekho.", "Workflow details ke liye Guide Book kholo. Inventory real hone par bhi dashboard sample data hi hai."], "example": "Example: sample branch mein ₹1,42,500 revenue aur chaar overdue tasks hain. In numbers se business decisions mat lo."}}, {"module": "REPORTS", "route": "/reports", "icon": "📑", "cat": "frontend", "status": "pending", "title": "Reports", "short": "Six sample reports with charts, tables and CSV export.", "what": "Sales Trend, MIS Scorecard, Food Cost & Menu Margin, Inventory Variance, Cash Reconciliation and Aggregator Reconciliation use mock datasets. They are not connected to live transactions.", "how": ["Open a report card.", "Review its charts and table.", "Export CSV downloads the same sample dataset for spreadsheet review."], "example": "Illustration: a ₹420 dish with a sample ₹138 ingredient cost appears in Food Cost. These are demo values, not a verified recipe cost.", "hinglish": {"title": "Reports", "short": "Charts, tables aur CSV export ke saath chhe sample reports.", "what": "Sales Trend, MIS, Food Cost, Inventory Variance, Cash aur Aggregator reports mock data use karti hain. Live transactions connected nahi hain.", "how": ["Report card kholo.", "Charts aur table dekho.", "Export CSV se wahi sample dataset spreadsheet ke liye download hota hai."], "example": "Example: ₹420 ki dish aur ₹138 sample ingredient cost Food Cost mein dikhti hai. Yeh demo values hain, verified recipe cost nahi."}}, {"module": "MIS_PERFORMANCE", "route": "/performance", "icon": "🏆", "cat": "frontend", "status": "pending", "title": "MIS Leaderboard", "short": "Illustrative staff rankings, completion counts and weighted scores.", "what": "The displayed task/delegation/variance/cashier weighting is 40/30/20/10. Scores and timestamps are sample data; live score calculation is pending.", "how": ["Compare On Time, Delay and Not Done counts.", "Review the score chart and table.", "Export CSV to inspect the illustrative rankings."], "example": "Illustration: Rahul’s sample score is 93.1%. It is not an assessment of a real employee.", "hinglish": {"title": "MIS Leaderboard", "short": "Staff ranking, completion counts aur weighted score ka demo.", "what": "Task/delegation/variance/cashier weighting 40/30/20/10 dikhayi gayi hai. Scores aur timestamps sample hain; live calculation pending hai.", "how": ["On Time, Delay aur Not Done counts compare karo.", "Score chart aur table dekho.", "Sample ranking inspect karne ke liye Export CSV use karo."], "example": "Example: Rahul ka sample score 93.1% hai. Yeh kisi real employee ka assessment nahi."}}, {"module": "TASKS_DELEGATION", "route": "/tasks", "icon": "✅", "cat": "frontend", "status": "pending", "title": "Tasks & Checklists", "short": "Try recurring checklists and one-time task delegation.", "what": "This interactive demo keeps tasks in browser page state. Reloading resets changes. Automatic recurrence, reminders, file upload storage and task persistence are not connected.", "how": ["Create a recurring checklist with title, branch, doer, frequency and shift time.", "Delegate a one-time task with priority and due time.", "Mark Done: evidence selection is optional for recurring tasks and required for delegation. Only the selected file name is retained, not an uploaded file."], "example": "Illustration: create a fridge-check task, then mark it Done. Reloading removes your demo changes; no recurring schedule was created.", "hinglish": {"title": "Tasks & Checklists", "short": "Recurring checklist aur one-time delegation try karo.", "what": "Demo tasks browser page state mein rehte hain. Reload par changes reset hote hain. Auto recurrence, reminders, file storage aur task persistence connected nahi hain.", "how": ["Title, branch, doer, frequency aur shift time se recurring checklist banao.", "Priority aur due time se one-time task saunpo.", "Mark Done mein recurring evidence optional aur delegation evidence zaroori hai. Sirf selected file ka naam rehta hai, file upload nahi hoti."], "example": "Example: fridge-check task banao aur Done karo. Reload par changes hat jaayenge; recurring schedule create nahi hua."}}, {"module": "INVENTORY", "route": "/inventory", "icon": "📦", "cat": "backend", "status": "live", "title": "Inventory", "short": "Real branch stock, units, minimum/maximum levels and alerts.", "what": "Stock records are saved in PostgreSQL. Material names share a common catalog, but quantities and alert levels belong to individual branches. Owner can view all branches; permitted branch staff operate within their own branch.", "how": ["Choose a permitted branch and review stock.", "Add Item: enter name, branch, unit, opening quantity and minimum/maximum levels.", "An existing catalog name reuses its material/unit. Below minimum shows Low stock; above a positive maximum shows Overstock.", "This screen does not create purchase indents or manage expiry batches."], "example": "Illustration: Chicken at 9 kg against a 20 kg minimum shows Low stock for that branch. Adding stock does not change another branch’s record.", "hinglish": {"title": "Inventory", "short": "Real branch stock, units, min/max levels aur alerts.", "what": "Stock PostgreSQL mein save hota hai. Material catalog common hai, par quantity aur alert levels har branch ke alag hain. Owner sab branches dekh sakta hai; permitted branch staff sirf apni branch mein kaam karte hain.", "how": ["Permitted branch chuno aur stock dekho.", "Add Item mein naam, branch, unit, opening qty aur min/max bharo.", "Existing catalog naam par wahi material/unit use hoti hai. Minimum se kam par Low stock; positive maximum se zyada par Overstock aata hai.", "Is screen se purchase indent nahi banti aur expiry batches manage nahi hote."], "example": "Example: Chicken 9 kg aur minimum 20 kg ho to us branch mein Low stock dikhta hai. Doosri branch ka stock nahi badalta."}}, {"module": "PURCHASE_ORDER", "route": "/purchase", "icon": "🛒", "cat": "backend", "status": "pending", "title": "Purchase & GRN", "short": "Interactive indent, purchase and quality-check demo.", "what": "Try the workflow without posting real purchases. Indents, POs and GRNs are page-local mock records. Quality decisions do not update live Inventory, create vendor returns or post Accounts refunds.", "how": ["Raise an indent, submit for approval, then approve or reject it.", "Create a store or general purchase. Try Buy, optional Bill Upload and Material Receive.", "Open the GRN quality check and choose Pass, Fail or Partial. The result is a demo only; no stock/refund posting occurs."], "example": "Illustration: mark a demo GRN Partial with 2 kg failed. Its row changes, but live inventory and accounts remain unchanged.", "hinglish": {"title": "Purchase & GRN", "short": "Indent, purchase aur quality-check ka interactive demo.", "what": "Real purchase post kiye bina workflow try karo. Indents, POs aur GRNs page-local mock records hain. Quality decision se live Inventory, vendor return ya Accounts refund nahi banta.", "how": ["Indent banao, approval ke liye bhejo, phir approve/reject karo.", "Store ya general purchase banao. Buy, optional Bill Upload aur Material Receive try karo.", "GRN quality check mein Pass, Fail ya Partial chuno. Sirf demo result hai; stock/refund posting nahi hoti."], "example": "Example: demo GRN Partial karo aur 2 kg failed bharo. Row badlegi, par live inventory aur accounts nahi badlenge."}}, {"module": "POS_CASHIER", "route": "/pos", "icon": "💳", "cat": "frontend", "status": "pending", "title": "POS / Cashier", "short": "Create sample order headers across dine-in and delivery channels.", "what": "Orders use mock page state, not a live billing ledger. Line items, payment collection, invoice posting and database persistence are not implemented.", "how": ["New Order: enter branch, channel, table if applicable, amount and tender.", "Create Order adds a row to this page.", "Reload to restore the original sample dataset."], "example": "Illustration: enter a ₹1,840 dine-in order paid by UPI. The demo row is not a real bill or payment receipt.", "hinglish": {"title": "POS / Cashier", "short": "Dine-in aur delivery channels ke sample order headers banao.", "what": "Orders mock page state use karte hain, live billing ledger nahi. Line items, payment collection, invoice posting aur database persistence implement nahi hain.", "how": ["New Order mein branch, channel, table (agar ho), amount aur tender bharo.", "Create Order se is page par row aati hai.", "Reload par original sample dataset wapas aata hai."], "example": "Example: ₹1,840 ka dine-in order UPI tender se bharo. Demo row real bill ya payment receipt nahi hai."}}, {"module": "CASH_DROP", "route": "/cash-drop", "icon": "🔒", "cat": "frontend", "status": "pending", "title": "Blind Cash Drop", "short": "Count denominations and submit an illustrative closing total.", "what": "The page totals notes and coins locally. No expected-cash API, saved cash-drop record or shortage/excess calculation is connected yet. Do not treat demo submission as shift closure.", "how": ["Enter counts for each note denomination.", "Add the total coin value.", "Submit Cash Drop to see the counted total. Reloading resets it."], "example": "Illustration: a counted ₹18,350 is displayed after submission. No shortage is calculated and no closing entry is saved.", "hinglish": {"title": "Blind Cash Drop", "short": "Notes aur coins gino aur sample closing total submit karo.", "what": "Page notes aur coins locally total karta hai. Expected-cash API, saved cash-drop record aur shortage/excess calculation connected nahi hain. Demo submission ko shift closure mat samjho.", "how": ["Har denomination ke notes ki ginti bharo.", "Coins ki total value bharo.", "Submit Cash Drop se counted total dekho. Reload par reset hota hai."], "example": "Example: submission ke baad gina hua ₹18,350 dikhta hai. Shortage calculate ya closing entry save nahi hoti."}}, {"module": "ACCOUNTS_EXPENSES", "route": "/accounts", "icon": "💰", "cat": "finance", "status": "mixed", "title": "Accounts", "short": "Real branch expenses and payroll costs; other accounting areas remain clearly marked demos.", "what": "Permitted accountants enter Rent, Utilities, Marketing and Other operating expenses with branch, date, amount and reference. Expenses persist and can be voided with a reason. P&L shows actual posted expenses and finalized salary snapshots. Sales and food-cost integration remain pending, so gross/net profit are not invented. Petty cash, aggregator reconciliation and balance-sheet areas remain demo or pending, as labelled.", "how": ["Choose branch and month, then open Expenses or P&L.", "Add an expense with category, date, subcategory, amount, description and bill/reference; save and reload to confirm persistence.", "Use Void with a reason to reverse an incorrect expense without deleting its history. Do not enter payroll again as an operating expense: finalized payroll supplies labor cost."], "example": "Example: save ₹5,000 Rent for a test branch in September. Its real September rent total increases by ₹5,000. Net profit remains unavailable until sales and COGS are connected.", "hinglish": {"title": "Accounts", "short": "Real branch expenses aur payroll costs; baaki accounting areas labelled demo hain.", "what": "Permission wala accountant Rent, Utilities, Marketing aur Other expense branch/date/amount/reference ke saath daalta hai. Expenses save hote hain aur reason dekar Void kiye ja sakte hain. P&L mein real expenses aur finalized salary cost aati hai. Sales/food-cost integration pending hai, isliye gross/net profit invent nahi hota. Baaki accounting areas par demo/pending label dekho.", "how": ["Branch aur month chuno, phir Expenses ya P&L kholo.", "Category, date, subcategory, amount, description aur bill/reference se expense add karo; save ke baad reload se persistence check karo.", "Galat expense ko reason dekar Void karo; history delete nahi hoti. Salary dobara expense mein mat daalo: finalized payroll se labor cost aati hai."], "example": "Example: test branch mein September ka ₹5,000 Rent save karo. Real rent total ₹5,000 badhega. Sales/COGS connect hone tak Net Profit unavailable rahega."}}, {"module": "PAYROLL", "route": "/workforce", "icon": "👥", "cat": "finance", "status": "live", "title": "Staff, Attendance & Payroll", "short": "Real employee rates, daily attendance, approved leave and monthly salary snapshots.", "what": "Set ON_ROLL monthly salary or OFF_ROLL daily wages once. There is no Weekly Off status. Present is one unit, Half Day is half, Absent is zero. Employees apply leave; an authorized manager other than the applicant approves or rejects. Only approved paid ON_ROLL leave contributes paid units. OFF_ROLL leave is unpaid. ON_ROLL uses the actual calendar days in each month, including leap years. Missing attendance blocks finalization. Final payroll is immutable and does not transfer money. After ANY leave history (PENDING/APPROVED/REJECTED), the employee login link cannot be assigned, replaced or cleared, even by Owner. Keeping the existing link and other safe edits are allowed.", "how": ["With PAYROLL access, create an employee in a test branch, set employment type/rate/join date and optionally link their same-branch login for self-service leave.", "With ATTENDANCE access, mark each eligible day Present, Half Day or Absent. Approved leave is shown separately and cannot be double marked.", "Employee applies leave with dates/reason. A different authorized reviewer selects Approved or Rejected; paid/unpaid is explicit for on-roll, off-roll leave stays unpaid.", "Preview a completed month, resolve missing dates and finalize a single branch. Final payroll feeds P&L labor cost once; future rate changes take effect from an explicit future month boundary."], "example": "Example: September has 30 days. A ₹30,000 monthly employee with 29 Present days and one approved Paid Leave earns ₹30,000. An ₹800 daily-wage employee with 20 full days and one half-day earns ₹16,400; all other eligible dates must be marked/covered before finalizing.", "hinglish": {"title": "Staff, Attendance aur Salary", "short": "Real employee rates, daily attendance, approved leave aur monthly salary snapshots.", "what": "ON_ROLL ki monthly salary ya OFF_ROLL ki daily wage ek baar set karo. Weekly Off status nahi hai. Present 1, Half Day 0.5, Absent 0 units. Employee leave apply karta hai; applicant se alag authorized manager approve/reject karta hai. Sirf approved paid ON_ROLL leave paid units mein aati hai. OFF_ROLL leave unpaid hai. ON_ROLL calculation actual 28/29/30/31 calendar days se hoti hai. Missing attendance par finalization blocked; final payroll immutable hai, paisa transfer nahi hota. Koi bhi leave history (PENDING/APPROVED/REJECTED) hone ke baad employee login link assign, replace ya clear nahi kar sakte, Owner bhi nahi. Existing link rakhna aur doosre safe edits allowed hain.", "how": ["PAYROLL access se test branch mein employee banao; employment type/rate/join date set karo aur self-service leave ke liye same-branch login optionally link karo.", "ATTENDANCE access se har eligible din Present, Half Day ya Absent mark karo. Approved leave alag dikhti hai aur double attendance mark nahi hoti.", "Employee dates/reason se leave apply kare. Doosra authorized reviewer Approved/Rejected chune; on-roll par paid/unpaid explicit, off-roll leave unpaid rahegi.", "Completed month preview karo, missing dates resolve karke single branch finalize karo. Salary cost P&L mein ek baar aati hai; rate change explicit future month se hota hai."], "example": "Example: September mein 30 din hain. ₹30,000 monthly employee ke 29 Present aur 1 approved Paid Leave par ₹30,000 bante hain. ₹800 daily wage ke 20 full aur 1 half-day par ₹16,400. Finalize se pehle baaki eligible dates bhi marked/covered honi chahiye."}}, {"module": "USER_ADMIN", "route": "/admin/users", "icon": "👥", "cat": "admin", "status": "live", "title": "Users & Access", "short": "Create real users with roles, branch assignment and module grants.", "what": "Owner manages all branches and HQ roles. Branch Admin manages only own-branch users and cannot grant more access than they hold, edit themselves or create HQ roles. Server-side permissions govern real records.", "how": ["New User: enter name, 10-digit mobile number (without +91), a password of at least 12 characters, role and branch.", "Select allowed module grants and save. Branch Admin sees only delegable grants.", "Edit a user to change access/status/password. Saved changes revoke the user’s existing sessions; blank password retains the existing password."], "example": "Illustration: give a cashier only POS and Cash Drop grants. Other modules remain inaccessible; grants do not make demo modules database-backed.", "hinglish": {"title": "Users & Access", "short": "Real users banao: role, branch aur module grants ke saath.", "what": "Owner sab branches aur HQ roles manage karta hai. Branch Admin sirf apni branch ke users manage karta hai; apne se zyada grants nahi de sakta, khud ko edit ya HQ role create nahi kar sakta. Server permissions real records par lagti hain.", "how": ["New User mein naam, 10-digit mobile number (without +91), kam se kam 12-character password, role aur branch bharo.", "Allowed module grants chuno aur save karo. Branch Admin ko sirf delegable grants dikhte hain.", "Edit se access/status/password badlo. Save par purane sessions revoke hote hain; blank password par purana password rehta hai."], "example": "Example: cashier ko sirf POS aur Cash Drop grants do. Doosre modules accessible nahi honge; grants demo modules ko DB-backed nahi banate."}}, {"module": "BRANCH_ADMIN", "route": "/admin/branches", "icon": "🏢", "cat": "admin", "status": "live", "title": "Branches", "short": "Real branch records; only Owner creates branches.", "what": "Owner can create and edit branches. Branch Admin sees and maintains only their own branch. Creating a branch does not clone menus, recipes, checklists or stock. The clone wizard is not implemented.", "how": ["Owner: New Branch, then enter code, name, address, coordinates and geofence radius.", "Edit a permitted row and save. The screen reads the saved record back from PostgreSQL.", "New branches start empty. Branch deletion is not offered by this screen."], "example": "Illustration: Owner creates B7 — Vasant Kunj. It becomes a real branch option in user administration; no menu or stock is copied.", "hinglish": {"title": "Branches", "short": "Real branch records; sirf Owner nayi branch banata hai.", "what": "Owner branches create/edit kar sakta hai. Branch Admin sirf apni branch dekhta aur maintain karta hai. Branch banane se menu, recipes, checklist ya stock clone nahi hote. Clone wizard implement nahi hai.", "how": ["Owner: New Branch mein code, naam, address, coordinates aur geofence radius bharo.", "Permitted row Edit karke save karo. Screen PostgreSQL se saved record dobara padhti hai.", "Nayi branch khali shuru hoti hai. Is screen par branch delete option nahi hai."], "example": "Example: Owner B7 — Vasant Kunj banata hai. User administration mein real branch option aata hai; menu ya stock copy nahi hota."}}, {"module": "WHATSAPP_LOGS", "route": "/admin/settings/whatsapp", "icon": "📲", "cat": "whatsapp", "status": "live", "title": "WhatsApp Settings (ChatXFlow)", "short": "Owner-only provider configuration saved in the real database.", "what": "Connect a number in ChatXFlow, then save the provider token, phone and pinned base URL here. Saving credentials does not enable task reminders, approval messages, 8AM summaries or inbound webhooks; these automation workflows are still pending.", "how": ["Owner: connect the WhatsApp number using ChatXFlow’s own QR flow.", "Paste the Developer API Token and set the WhatsApp phone number.", "Save Settings. Leave the token blank to retain an existing saved token. Custom hosts are not allowed."], "example": "Illustration: Owner saves provider settings. This proves configuration storage only, not automatic delivery of task reminders or approval buttons.", "hinglish": {"title": "WhatsApp Settings (ChatXFlow)", "short": "Owner-only provider configuration real database mein save hoti hai.", "what": "ChatXFlow mein number connect karo, phir provider token, phone aur fixed base URL yahan save karo. Credentials save karne se task reminders, approval messages, 8AM summary ya inbound webhooks enable nahi hote; yeh automation pending hain.", "how": ["Owner: ChatXFlow ke apne QR flow se WhatsApp number connect karo.", "Developer API Token paste karo aur WhatsApp phone number set karo.", "Save Settings dabao. Existing token rakhne ke liye token blank chhodo. Custom hosts allowed nahi hain."], "example": "Example: Owner provider settings save karta hai. Isse sirf configuration storage verify hoti hai, automatic reminders ya approval buttons ki delivery nahi."}}];
const EXAMPLES = {"/dashboard": {"en": {"scenario": "You own six branches and want to compare today's sample performance.", "steps": ["Open Owner Dashboard and select All branches (compiled).", "Read Total Sales and Total Inventory Value, then scroll to the branch comparison table.", "Select Connaught Place in the branch selector and compare its displayed KPIs with the compiled view.", "Return to All branches. No sales or inventory records are changed by viewing these charts."], "result": "The displayed sample KPIs change with the branch selection. They do not become live accounting figures: this dashboard is a demo, even though Inventory uses the database."}, "hinglish": {"scenario": "Aapki chhe branches hain aur aaj ki sample performance compare karni hai.", "steps": ["Owner Dashboard kholo aur All branches (compiled) chuno.", "Total Sales aur Total Inventory Value dekho, phir neeche branch comparison table padho.", "Branch selector mein Connaught Place chuno aur uske KPIs ko compiled view se compare karo.", "Wapas All branches chuno. Charts dekhne se sales ya inventory records nahi badalte."], "result": "Branch selection ke saath sample KPIs badlenge. Yeh live accounting numbers nahi hain: Inventory DB-backed hone par bhi dashboard abhi demo hai."}}, "/reports": {"en": {"scenario": "You want to review sample dish costs and share the report in a spreadsheet.", "steps": ["Open Reports, then the Food Cost & Menu Margin report card.", "Pick a sample dish row and compare its selling price with ingredient cost and margin.", "Click Export CSV and open the downloaded file in Excel or another spreadsheet app.", "Compare the exported rows with the report table. Do not use this sample report to change actual menu prices."], "result": "A CSV containing the report's sample rows is downloaded. Exporting does not create or change a real purchase, recipe or financial record."}, "hinglish": {"scenario": "Sample dish cost dekhni hai aur report spreadsheet mein share karni hai.", "steps": ["Reports kholo, phir Food Cost & Menu Margin card kholo.", "Kisi sample dish ka selling price, ingredient cost aur margin compare karo.", "Export CSV dabao aur downloaded file Excel ya kisi spreadsheet app mein kholo.", "Exported rows ko report table se milao. Sample report se asli menu prices mat badlo."], "result": "Report ki sample rows wali CSV download hogi. Export se real purchase, recipe ya financial record create/change nahi hota."}}, "/performance": {"en": {"scenario": "You want to understand why one sample employee ranks above another.", "steps": ["Open MIS Leaderboard and find Rahul Sharma's sample row.", "Read On Time, Delay and Not Done counts together, not just the rank.", "Compare his score with another employee and the chart. The shown task/delegation/variance/cashier weights are 40/30/20/10.", "Use Export CSV to review the sample ranking outside the app."], "result": "You can explain the displayed ranking and counts. These are illustrative scores, not a live performance assessment or an automatically calculated payroll result."}, "hinglish": {"scenario": "Samajhna hai ki ek sample employee ki ranking doosre se upar kyun hai.", "steps": ["MIS Leaderboard kholo aur Rahul Sharma ki sample row dekho.", "Sirf rank nahi, On Time, Delay aur Not Done counts saath mein padho.", "Doosre employee aur chart se score compare karo. Task/delegation/variance/cashier weights 40/30/20/10 dikhaye gaye hain.", "App ke bahar ranking dekhne ke liye Export CSV use karo."], "result": "Displayed ranking aur counts samajh aayenge. Yeh sample scores hain, live employee assessment ya automatic payroll result nahi."}}, "/tasks": {"en": {"scenario": "Assign a one-time fridge-cleaning task and demonstrate the evidence requirement.", "steps": ["Click Delegate Task. Title: Clean fridge; Branch: Connaught Place; Assign to: Rahul Sharma.", "Choose HIGH priority and a future due date/time, then create the task.", "Find the new row and click Mark Done. Without selecting an attachment, submission stays blocked.", "Select a non-sensitive sample image and click Mark Done. For a recurring/checklist task, evidence selection is optional instead."], "result": "The demo row changes to Done. Only the selected file name is kept in page state; no file is uploaded, no reminder is scheduled, and reloading resets the demo changes."}, "hinglish": {"scenario": "Fridge saaf karne ka one-time task do aur evidence rule samjho.", "steps": ["Delegate Task dabao. Title: Clean fridge; Branch: Connaught Place; Assign to: Rahul Sharma.", "HIGH priority aur future due date/time chuno, phir task banao.", "Nayi row ka Mark Done dabao. Attachment select kiye bina submit blocked rahega.", "Koi non-sensitive sample image select karo aur Mark Done dabao. Recurring/checklist task mein evidence optional hai."], "result": "Demo row Done ho jaayegi. Sirf file ka naam page state mein rehta hai; file upload, reminder schedule ya DB save nahi hota. Reload par demo changes reset hote hain."}}, "/inventory": {"en": {"scenario": "Add a new practice ingredient with low opening stock in a permitted branch.", "steps": ["Choose your permitted branch and click Add Item.", "Name: Practice Ingredient (use a new name); Unit: kg; Opening quantity: 9; Minimum: 20; Maximum: 60.", "Select the intended branch and save. Do this only in a test branch: this screen writes real database records.", "Check that the row shows 9 kg and Low stock. Reload the page to confirm it remains saved."], "result": "This branch has a persisted stock row and a low-stock alert because 9 is below 20. Another branch's stock is unchanged. This is a real write, not a disposable page-only demo."}, "hinglish": {"scenario": "Permitted branch mein kam opening stock wala naya practice ingredient add karo.", "steps": ["Apni permitted branch chuno aur Add Item dabao.", "Name: Practice Ingredient (naya naam lo); Unit: kg; Opening quantity: 9; Minimum: 20; Maximum: 60.", "Sahi branch select karke save karo. Sirf test branch mein try karo: yeh screen real DB record likhti hai.", "Row mein 9 kg aur Low stock dekho. Reload karke confirm karo ki record save hai."], "result": "Is branch ka stock save hoga aur 9, minimum 20 se kam hone ke kaaran alert aayega. Doosri branch ka stock nahi badlega. Yeh real DB write hai, page-only demo nahi."}}, "/purchase": {"en": {"scenario": "Try buying a general item without a store indent, then inspect the quality-check flow.", "steps": ["Click New Purchase and select General purchase.", "Branch: Connaught Place; Vendor: Practice Repairs; Item description: Office chair repair; Amount: ₹500. Click Create (Step 1: Buy).", "In Purchase Orders, try the optional bill step and then Mark Material Received. Inspect the resulting demo GRN.", "Open a pending GRN's Quality Check. Try Pass, or Partial/Fail with a failure quantity in the displayed unit."], "result": "The local PO/GRN progress and quality result change. No live inventory, vendor return, refund or Accounts entry is posted. Reloading restores the sample data."}, "hinglish": {"scenario": "Store indent ke bina general item purchase try karo, phir quality check dekho.", "steps": ["New Purchase dabao aur General purchase chuno.", "Branch: Connaught Place; Vendor: Practice Repairs; Item description: Office chair repair; Amount: ₹500. Create (Step 1: Buy) dabao.", "Purchase Orders mein optional bill step aur phir Mark Material Received try karo. Bani hui demo GRN dekho.", "Pending GRN ka Quality Check kholo. Pass try karo, ya displayed unit mein fail quantity bharke Partial/Fail chuno."], "result": "Local PO/GRN progress aur quality result badlega. Live stock, vendor return, refund ya Accounts posting nahi hogi. Reload par sample data wapas aayega."}}, "/pos": {"en": {"scenario": "Create an illustrative dine-in order paid by UPI.", "steps": ["Open POS / Cashier and click New Order.", "Branch: Connaught Place; Channel: DINE_IN; Table: T-12.", "Amount: ₹1,840; Tender: UPI. Click Create Order.", "Find the newly added order row and compare its branch, table, amount and tender."], "result": "A demo order row appears on this page. It is not a bill, tax invoice or payment receipt; no money is collected and reloading resets the row."}, "hinglish": {"scenario": "UPI tender wala sample dine-in order banao.", "steps": ["POS / Cashier kholo aur New Order dabao.", "Branch: Connaught Place; Channel: DINE_IN; Table: T-12.", "Amount: ₹1,840; Tender: UPI. Create Order dabao.", "Nayi row mein branch, table, amount aur tender milao."], "result": "Page par demo order row aayegi. Yeh bill, tax invoice ya payment receipt nahi hai; paisa collect nahi hota aur reload par row reset ho jaati hai."}}, "/cash-drop": {"en": {"scenario": "Count an illustrative shift-closing cash total of ₹6,550.", "steps": ["Enter 10 notes in the ₹500 field: ₹5,000.", "Enter 5 notes in ₹200 and 5 notes in ₹100: another ₹1,500. Leave other denominations at zero.", "Enter ₹50 as the total value of coins, not the number of coins.", "Confirm the total is ₹6,550 and click Submit Cash Drop."], "result": "The page displays the counted ₹6,550. This demo does not fetch expected cash, calculate shortage/excess or save a real shift-closing entry."}, "hinglish": {"scenario": "Shift closing ka sample cash ₹6,550 gino.", "steps": ["₹500 field mein 10 notes bharo: ₹5,000.", "₹200 mein 5 aur ₹100 mein 5 notes bharo: aur ₹1,500. Baaki denominations zero rakho.", "Coins mein ₹50 total value bharo, coins ki ginti nahi.", "Total ₹6,550 confirm karke Submit Cash Drop dabao."], "result": "Page par counted ₹6,550 dikhega. Demo expected cash fetch, shortage/excess calculation ya real shift-closing entry save nahi karta."}}, "/accounts": {"en": {"scenario": "Enter a real ₹5,000 branch rent expense and inspect its month total. Practice only in a test branch.", "steps": ["Open Accounts, select a test branch and the intended month, then choose Expenses.", "Add expense: category RENT, date within that month, amount ₹5,000, description Test branch rent, and your bill/reference.", "Save, reload and find the posted record. Open P&L for the same branch/month and check Rent.", "If this was a practice mistake, Void the expense with a reason; retain its history rather than entering an offsetting duplicate."], "result": "A real database expense increases Rent by ₹5,000 and a void excludes it from totals. Finalized payroll contributes Labor Cost separately. Revenue/COGS and gross/net profit remain unavailable until sales/stock posting are connected; no sample profit is mixed in."}, "hinglish": {"scenario": "Real ₹5,000 branch rent daalo aur month total dekho. Practice sirf test branch mein karo.", "steps": ["Accounts kholo, test branch aur sahi month chuno, phir Expenses kholo.", "Expense add karo: category RENT, us month ki date, amount ₹5,000, description Test branch rent aur bill/reference.", "Save, reload aur posted record dekho. Same branch/month ka P&L kholkar Rent check karo.", "Practice mein galti hui ho to reason dekar Void karo; duplicate offset entry mat daalo, history rakho."], "result": "Real DB expense se Rent ₹5,000 badhta hai; Void par total se exclude hota hai. Finalized payroll ki Labor Cost alag aati hai. Sales/stock posting connect hone tak Revenue/COGS aur gross/net profit unavailable hain; sample profit mix nahi hota."}}, "/workforce": {"en": {"scenario": "Calculate September salary for one monthly employee and one daily-wage employee in a test branch. Prerequisites: link employee A to a same-branch login with LEAVE_SELF; the attendance marker needs ATTENDANCE, and a DIFFERENT reviewer needs LEAVE_APPROVAL. Neither the linked employee nor the request submitter may review, including Owner.", "steps": ["With PAYROLL access, create ON_ROLL employee A at ₹30,000 per month and OFF_ROLL employee B at ₹800 per day, joined on September 1. Use a completed September, not a future month.", "Mark A Present for 29 days; A applies one day leave and a different authorized manager approves it as PAID. No Weekly Off is assumed.", "For B, mark 20 full Present days and one Half Day; mark the other eligible days Absent or cover them with approved unpaid leave. Resolve every missing date.", "Preview September: A ₹30,000 and B ₹16,400. Finalize the test branch only after checking amounts; repeated finalization must not duplicate salary."], "result": "The finalized database snapshots total ₹46,400 and supply P&L Labor Cost once. They do not send bank payments. Final attendance/leave cannot be rewritten; rate changes require a future month effective date. Pending/rejected leave gives no pay credit."}, "hinglish": {"scenario": "Test branch mein ek monthly aur ek daily-wage employee ki September salary nikalo. Pehle A ko same-branch login se link karo aur LEAVE_SELF do; attendance mark karne wale ke paas ATTENDANCE aur ALAG reviewer ke paas LEAVE_APPROVAL ho. Linked employee ya request submitter khud review nahi kar sakte, Owner bhi nahi.", "steps": ["PAYROLL access se A ko ON_ROLL ₹30,000 monthly aur B ko OFF_ROLL ₹800 daily par September 1 se banao. Completed September use karo, future month nahi.", "A ke 29 Present mark karo; A ek din leave apply kare aur doosra authorized manager PAID approve kare. Weekly Off assume nahi hoga.", "B ke 20 full Present aur ek Half Day mark karo; baaki eligible din Absent ya approved unpaid leave se cover karo. Har missing date resolve karo.", "September preview mein A ₹30,000 aur B ₹16,400 check karo. Amounts dekhkar sirf test branch finalize karo; repeat finalization salary duplicate nahi karegi."], "result": "Real finalized snapshots ka total ₹46,400 hai aur P&L Labor Cost mein ek baar aata hai. Bank payment send nahi hoti. Final attendance/leave rewrite nahi hoti; rate change future month se hota hai. Pending/rejected leave se pay credit nahi milta."}}, "/admin/users": {"en": {"scenario": "Give a new cashier access only to POS and Cash Drop in a test branch.", "steps": ["As Owner or an authorized Branch Admin, click New User. Use a test employee's name and an unused 10-digit mobile number you control.", "Set a new private password of at least 12 characters, Role: CASHIER, and the intended branch. Never copy a password from a guide or chat.", "Select only POS_CASHIER and CASH_DROP, then save. A Branch Admin can grant only permissions they already hold.", "Sign in separately as the test user. The sidebar and Guide Book should show only permitted modules; direct forbidden URLs remain denied."], "result": "A real account is saved with branch/module restrictions. This is not a page-only demo; remove or disable the practice account after testing."}, "hinglish": {"scenario": "Test branch ke naye cashier ko sirf POS aur Cash Drop access do.", "steps": ["Owner ya authorized Branch Admin se New User dabao. Test employee ka naam aur apne control wala unused 10-digit mobile number do.", "Kam se kam 12-character ka naya private password set karo, Role: CASHIER aur sahi branch chuno. Guide/chat se password copy mat karo.", "Sirf POS_CASHIER aur CASH_DROP tick karke save karo. Branch Admin wahi grants de sakta hai jo khud uske paas hain.", "Alag session mein test user login karo. Sidebar aur Guide Book mein sirf permitted modules dikhne chahiye; forbidden direct URLs denied rahengi."], "result": "Branch/module restrictions wala real account save hota hai. Yeh page-only demo nahi; testing ke baad practice account disable/remove karo."}}, "/admin/branches": {"en": {"scenario": "Owner adds a new practice branch without copying another branch's data.", "steps": ["As Owner, open Branches and click New Branch.", "Code: PRACTICE7; Name: Practice Vasant Kunj; Address: Test address. Use a unique code.", "Enter the branch's actual latitude/longitude and a geofence radius of 50 metres, then Save. Use a test branch rather than altering a real one.", "Reload and find the new branch. Check the branch dropdown in Users & Access."], "result": "A real empty branch is saved and becomes selectable. Menus, recipes, users and stock are not cloned. Branch Admin can edit only their own branch and cannot create this new branch."}, "hinglish": {"scenario": "Owner doosri branch ka data copy kiye bina nayi practice branch banaye.", "steps": ["Owner se Branches kholo aur New Branch dabao.", "Code: PRACTICE7; Name: Practice Vasant Kunj; Address: Test address. Unique code lo.", "Branch ke actual latitude/longitude aur 50 metre geofence radius bharo, phir Save karo. Real branch badalne ke bajaye test branch use karo.", "Reload par nayi branch dekho aur Users & Access ke branch dropdown mein check karo."], "result": "Real, khali branch save hogi aur selectable banegi. Menu, recipes, users ya stock clone nahi hote. Branch Admin sirf apni branch edit kar sakta hai; yeh nayi branch create nahi kar sakta."}}, "/admin/settings/whatsapp": {"en": {"scenario": "Owner connects provider configuration for a WhatsApp number they control.", "steps": ["In your own ChatXFlow account, connect your WhatsApp number through its QR flow.", "As Owner, open WhatsApp Settings and paste the actual Developer API Token privately into the token field. Never paste it into chat or this guide.", "Set your WhatsApp phone number, leave the approved base URL as https://chatxflow.online and click Save Settings.", "Reload to confirm the saved configuration. When editing later, leave the token blank to retain the existing token."], "result": "Provider configuration is saved in the real database and token display is masked. Saving alone does not send a message or enable reminders, approvals, webhooks or the 8AM summary."}, "hinglish": {"scenario": "Owner apne control wale WhatsApp number ki provider settings connect kare.", "steps": ["Apne ChatXFlow account mein QR flow se WhatsApp number connect karo.", "Owner se WhatsApp Settings kholo aur actual Developer API Token privately token field mein paste karo. Chat ya guide mein kabhi paste mat karo.", "Apna WhatsApp phone set karo, approved Base URL https://chatxflow.online hi rakho aur Save Settings dabao.", "Reload karke saved configuration confirm karo. Baad mein token blank chhodne par existing token retain hota hai."], "result": "Provider settings real DB mein save hoti hain aur token masked dikhta hai. Sirf Save se message send, reminders, approvals, webhooks ya 8AM summary enable nahi hote."}}};

let language="en", theme="light", openKey=null;
try { const l=localStorage.getItem("restaurant-guide-language"); if(["en","hinglish"].includes(l)) language=l; const th=localStorage.getItem("restaurant-guide-theme"); if(["light","dark","blue","emerald"].includes(th))theme=th;}catch{}
const el=id=>document.getElementById(id), tx=pair=>pair[language==="hinglish"?1:0];
function node(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n;}
function chapter(m){return language==="hinglish"?{...m,...m.hinglish}:m;}
function renderDetail(){if(!openKey)return;const base=MODULES.find(m=>m.module===openKey),m=chapter(base), target=el("detailContent");target.replaceChildren(node("div",m.route,"route"),node("h2",m.icon+" "+m.title),node("span",(m.status==="mixed"?tx(["Partly live","Kuch hissa real"]):tx(COPY[m.status==="live"?"live":"demo"])),"badge "+(m.status==="live"?"live":"demo")),node("h3",tx(COPY.what)),node("p",m.what),node("h3",tx(COPY.how)));const ul=node("ul","");m.how.forEach(s=>ul.append(node("li",s)));target.append(ul,node("h3",tx(["Try this example — step by step","Yeh example try karo — step by step"])));const ex=EXAMPLES[m.route]?.[language],box=node("section","","example");if(ex){box.append(node("p",ex.scenario));const steps=node("ol","");ex.steps.forEach(step=>steps.append(node("li",step)));box.append(steps,node("p",tx(["Expected result: ","Result kya hoga: "])+ex.result),node("small",tx(["Practice instructions only. Real-record steps should be tried in a test branch/account.","Sirf practice instructions. Real-record steps test branch/account mein try karo."])));}else{box.append(node("p",m.example));}target.append(box);}
function render(){document.documentElement.lang=language==="hinglish"?"hi-Latn":"en";document.documentElement.dataset.theme=theme;el("language").value=language;el("theme").value=theme;["subtitle","languageLabel","themeLabel","statusTitle","status","preferences","permissions","flowNote","footer","close"].forEach(id=>el(id).textContent=tx(COPY[id]));el("close").setAttribute("aria-label",tx(COPY.close));el("flow").replaceChildren();[tx(["Staff WhatsApp (planned workflows)","Staff WhatsApp (planned workflows)"]),"→","ChatXFlow API","→","Restaurant HQ ERP","→","PostgreSQL","→",tx(["Owner view","Owner view"])].forEach(s=>el("flow").append(node("span",s)));el("brandingTitle").textContent=tx(["Example: restaurant name and logo","Example: restaurant ka naam aur logo"]);el("brandingSteps").replaceChildren(...BRANDING_STEPS.map(s=>node("li",tx(s))));el("grid").replaceChildren();MODULES.forEach(base=>{const m=chapter(base),b=node("button","","card");b.type="button";const meta=node("div","","meta");meta.append(node("span",m.icon,"icon"),node("span",(m.status==="mixed"?tx(["Partly live","Kuch hissa real"]):tx(COPY[m.status==="live"?"live":"demo"])),"badge "+(m.status==="live"?"live":"demo")));b.append(meta,node("h3",m.title),node("div",tx(CATS[m.cat]),"category"),node("p",m.short),node("span",tx(COPY.tap),"tap"));b.onclick=()=>{openKey=m.module;renderDetail();el("detail").showModal();};el("grid").append(b);});renderDetail();}
el("language").onchange=e=>{language=e.target.value;try{localStorage.setItem("restaurant-guide-language",language)}catch{}render();};el("theme").onchange=e=>{theme=e.target.value;try{localStorage.setItem("restaurant-guide-theme",theme)}catch{}render();};el("close").onclick=()=>el("detail").close();el("detail").addEventListener("close",()=>{openKey=null;});render();
