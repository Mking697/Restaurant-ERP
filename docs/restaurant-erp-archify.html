er-only hai, read par auto nahi. Alag VENDOR_REFUNDS se read-only Vendor refunds mein expected claims dikhte hain, received paisa ya settlement nahi. Expense, purchase ya journal writes ki grant nahi milti."}},"/workforce":{"en":{"scenario":"Calculate September salary for one monthly employee and one daily-wage employee in a test branch. Prerequisites: link employee A to a same-branch login with LEAVE_SELF; the attendance marker needs ATTENDANCE, and a DIFFERENT reviewer needs LEAVE_APPROVAL. Neither the linked employee nor the request submitter may review, including Owner.","steps":["With PAYROLL access, create ON_ROLL employee A at ₹30,000 per month and OFF_ROLL employee B at ₹800 per day, joined on September 1. Use a completed September, not a future month.","Mark A Present for 29 days; A applies one day leave and a different authorized manager approves it as PAID. No Weekly Off is assumed.","For B, mark 20 full Present days and one Half Day; mark the other eligible days Absent or cover them with approved unpaid leave. Resolve every missing date.","Preview September: A ₹30,000 and B ₹16,400. Finalize the test branch only after checking amounts; repeated finalization must not duplicate salary."],"result":"The finalized database snapshots total ₹46,400 and supply P&L Labor Cost once. They do not send bank payments. Final attendance/leave cannot be rewritten; rate changes require a future month effective date. Pending/rejected leave gives no pay credit."},"hinglish":{"scenario":"Test branch mein ek monthly aur ek daily-wage employee ki September salary nikalo. Pehle A ko same-branch login se link karo aur LEAVE_SELF do; attendance mark karne wale ke paas ATTENDANCE aur ALAG reviewer ke paas LEAVE_APPROVAL ho. Linked employee ya request submitter khud review nahi kar sakte, Owner bhi nahi.","steps":["PAYROLL access se A ko ON_ROLL ₹30,000 monthly aur B ko OFF_ROLL ₹800 daily par September 1 se banao. Completed September use karo, future month nahi.","A ke 29 Present mark karo; A ek din leave apply kare aur doosra authorized manager PAID approve kare. Weekly Off assume nahi hoga.","B ke 20 full Present aur ek Half Day mark karo; baaki eligible din Absent ya approved unpaid leave se cover karo. Har missing date resolve karo.","September preview mein A ₹30,000 aur B ₹16,400 check karo. Amounts dekhkar sirf test branch finalize karo; repeat finalization salary duplicate nahi karegi."],"result":"Real finalized snapshots ka total ₹46,400 hai aur P&L Labor Cost mein ek baar aata hai. Bank payment send nahi hoti. Final attendance/leave rewrite nahi hoti; rate change future month se hota hai. Pending/rejected leave se pay credit nahi milta."}},"/admin/users":{"en":{"scenario":"Give a new cashier access only to POS and Cash Drop in a test branch.","steps":["As Owner or an authorized Branch Admin, click New User. Use a test employee's name and an unused 10-digit mobile number you control.","Set a new private password of at least 12 characters, Role: CASHIER, and the intended branch. Never copy a password from a guide or chat.","Select only POS_CASHIER and CASH_DROP, then save. A Branch Admin can grant only permissions they already hold.","Sign in separately as the test user. The sidebar and Guide Book should show only permitted modules; direct forbidden URLs remain denied."],"result":"A real account is saved with branch/module restrictions. This is not a page-only demo; remove or disable the practice account after testing."},"hinglish":{"scenario":"Test branch ke naye cashier ko sirf POS aur Cash Drop access do.","steps":["Owner ya authorized Branch Admin se New User dabao. Test employee ka naam aur apne control wala unused 10-digit mobile number do.","Kam se kam 12-character ka naya private password set karo, Role: CASHIER aur sahi branch chuno. Guide/chat se password copy mat karo.","Sirf POS_CASHIER aur CASH_DROP tick karke save karo. Branch Admin wahi grants de sakta hai jo khud uske paas hain.","Alag session mein test user login karo. Sidebar aur Guide Book mein sirf permitted modules dikhne chahiye; forbidden direct URLs denied rahengi."],"result":"Branch/module restrictions wala real account save hota hai. Yeh page-only demo nahi; testing ke baad practice account disable/remove karo."}},"/admin/branches":{"en":{"scenario":"Owner adds a new practice branch without copying another branch's data.","steps":["As Owner, open Branches and click New Branch.","Code: PRACTICE7; Name: Practice Vasant Kunj; Address: Test address. Use a unique code.","Enter the branch's actual latitude/longitude and a geofence radius of 50 metres, then Save. Use a test branch rather than altering a real one.","Reload and find the new branch. As Owner, Edit it and click Check deletion readiness. This reads linked-record counts only; no deletion or automatic cleanup occurs."],"result":"A real empty branch is saved and becomes selectable. Menus, recipes, users and stock are not cloned. Owner can inspect deletion readiness; linked records prevent API deletion and readiness is only a snapshot. Branch Admin can edit only their own branch, cannot create this new branch or read readiness counts. This screen offers no delete button."},"hinglish":{"scenario":"Owner doosri branch ka data copy kiye bina nayi practice branch banaye.","steps":["Owner se Branches kholo aur New Branch dabao.","Code: PRACTICE7; Name: Practice Vasant Kunj; Address: Test address. Unique code lo.","Branch ke actual latitude/longitude aur 50 metre geofence radius bharo, phir Save karo. Real branch badalne ke bajaye test branch use karo.","Reload par nayi branch dekho. Owner se Edit karke Deletion readiness check karein dabao. Sirf linked-record counts padhe jaate hain; deletion ya automatic cleanup nahi hota."],"result":"Real, khali branch save hogi aur selectable banegi. Menu, recipes, users ya stock clone nahi hote. Owner deletion readiness dekh sakta hai; linked records par API deletion blocked aur readiness sirf snapshot hai. Branch Admin sirf apni branch edit kar sakta hai; nayi branch create ya readiness counts read nahi kar sakta. Screen par delete button nahi hai."}},"/admin/settings/shifts":{"en":{"scenario":"Configure and cycle shifts only in an isolated QA test branch/account. Owner selects the QA branch, or a Branch Admin (BRANCH_MANAGER) with SHIFT_MANAGEMENT configures their own QA branch. The QA cashier needs CASH_DROP and POS_CASHIER. Real-write warning: configuration, starts, closes and acceptance persist; these are not production-live verification steps.","steps":["Open /admin/settings/shifts, select the QA branch, and use English (default) or optionally Hinglish. Set Shift A 00:00-12:00 and Add Shift for Shift B 12:00-00:00, then Save Shifts. The 1-12 windows must tile all 24h in IST, with no gaps or overlaps.","When no run is open, click Start Shift and Reload saved status. The server chooses the current window. Scheduled end is a reminder only: neither start nor close happens automatically at the clock time.","Using the QA cashier with CASH_DROP, open Cash Drop, accept any pending incoming handover, count physical cash and manually click End Shift & Handover once. The ended run is preserved and the next run opens with a PENDING handover.","Open POS as the next QA cashier: sale is blocked until amounts are reviewed and Accept Handover is clicked. For a single-shift cycle, save one 00:00-00:00 window; closing still opens a fresh run requiring acceptance. Reload status; changed windows never rewrite historical run times or delete old definition rows."],"result":"Real PostgreSQL definitions, runs and handovers persist. Only Owner or a granted Branch Admin can configure, and Branch Admin is own-branch only. Unconfigured branches retain legacy POS but cannot real-close. Accepted incoming physical cash plus current CASH sales determines expected closing; Card/UPI/Other are per-run receipts, not transfers. Initial cash float and safe withdrawals are not modeled."},"hinglish":{"scenario":"Shifts sirf isolated QA test branch/account mein configure aur cycle karo. Owner QA branch chune, ya SHIFT_MANAGEMENT wala Branch Admin (BRANCH_MANAGER) apni QA branch configure kare. QA cashier ko CASH_DROP aur POS_CASHIER chahiye. Real-write warning: config, start, close aur acceptance persist hote hain; yeh production-live verification steps nahi.","steps":["/admin/settings/shifts kholo, QA branch chuno aur English (default) ya optional Hinglish use karo. Shift A 00:00-12:00 aur Add Shift se Shift B 12:00-00:00 set karke Save Shifts karo. 1-12 windows IST mein pura 24h cover karein, gap/overlap nahi.","Run open na ho to Start Shift aur Reload saved status dabao. Server current window chunta hai. Scheduled end sirf reminder hai: clock time par start ya close automatic nahi hota.","CASH_DROP wale QA cashier se Cash Drop kholo, pending incoming handover accept karo, physical cash gino aur manually End Shift & Handover ek baar dabao. Ended run preserve hota hai aur next run PENDING handover ke saath khulta hai.","Next QA cashier se POS kholo: amounts review aur Accept Handover tak sale blocked hai. Single-shift cycle ke liye ek 00:00-00:00 window save karo; close par phir naya run acceptance maangega. Status reload karo; windows change se historical run times rewrite ya old definition rows delete nahi hote."],"result":"Real PostgreSQL definitions, runs aur handovers persist hain. Sirf Owner ya granted Branch Admin configure karega; Branch Admin apni branch tak limited hai. Unconfigured branch ka legacy POS chalta hai par real-close nahi. Accepted incoming physical cash + current CASH sales expected closing hai; Card/UPI/Other per-run receipts hain, transfers nahi. Initial cash float aur safe withdrawals modeled nahi hain."}},"/admin/settings/whatsapp":{"en":{"scenario":"Owner connects provider configuration for a WhatsApp number they control.","steps":["In your own ChatXFlow account, connect your WhatsApp number through its QR flow.","As Owner, open WhatsApp Settings and paste the actual Developer API Token privately into the token field. Never paste it into chat or this guide.","Set your WhatsApp phone number, leave the approved base URL as https://chatxflow.online and click Save Settings.","Reload to confirm the saved configuration. When editing later, leave the token blank to retain the existing token."],"result":"Provider configuration is saved in the real database and token display is masked. Saving alone does not send a message or enable reminders, approvals, webhooks or the 8AM summary."},"hinglish":{"scenario":"Owner apne control wale WhatsApp number ki provider settings connect kare.","steps":["Apne ChatXFlow account mein QR flow se WhatsApp number connect karo.","Owner se WhatsApp Settings kholo aur actual Developer API Token privately token field mein paste karo. Chat ya guide mein kabhi paste mat karo.","Apna WhatsApp phone set karo, approved Base URL https://chatxflow.online hi rakho aur Save Settings dabao.","Reload karke saved configuration confirm karo. Baad mein token blank chhodne par existing token retain hota hai."],"result":"Provider settings real DB mein save hoti hain aur token masked dikhta hai. Sirf Save se message send, reminders, approvals, webhooks ya 8AM summary enable nahi hote."}},"/menu":{"en":{"scenario":"Build a 2-level recipe: a Semi-FG gravy made from raw materials, a dish that uses that gravy, then produce real Semi-FG stock before selling it.","steps":["Recipe Builder: name Practice Gravy, mark it Semi-FG, set branch, output unit kg, add one raw-material ingredient row (e.g. Tomato, batch quantity 0.3) and Save — this is one atomic save of the dish + its whole recipe.","Recipe Builder again: name Practice Curry (sellable dish), add a raw-material row plus a Semi-FG row picking Practice Gravy, and Save.","Open Practice Curry, click Preview stock & cost — confirm it shows the theoretical raw-cost rollup AND separately flags Practice Gravy as required-but-unavailable (shortage), since no Semi-FG stock has been produced yet.","In the Semi-FG production & stock panel, pick Practice Gravy, enter an output quantity and Record production — confirm Practice Gravy's stock on hand increases; Preview stock & cost on Practice Curry now shows it available, not a shortage."],"result":"A real recipe tree is saved in Postgres, with explicit output units and one atomic save per recipe. A Semi-FG only becomes real sellable stock after it is actually produced — production consumes its own raw ingredients once; selling the dish that references it then consumes the produced Semi-FG stock directly, never that raw ingredient again."},"hinglish":{"scenario":"2-level recipe banao: raw material se Semi-FG gravy, us gravy ko use karne wali dish, phir bechne se pehle real Semi-FG stock produce karo.","steps":["Recipe Builder: naam Practice Gravy, Semi-FG mark karo, branch aur output unit kg set karo, ek raw-material ingredient row add karo (jaise Tomato, batch quantity 0.3) aur Save karo — yeh dish + poori recipe ka ek atomic save hai.","Recipe Builder dobara: naam Practice Curry (sellable dish), ek raw-material row aur ek Semi-FG row (Practice Gravy chun kar) add karo, Save karo.","Practice Curry kholo, Preview stock & cost dabao — confirm karo theoretical raw-cost rollup ke saath Practice Gravy ko required-but-unavailable (shortage) flag kiya gaya hai, kyunki abhi koi Semi-FG stock produce nahi hua.","Semi-FG production & stock panel mein Practice Gravy chuno, output quantity daalo aur Record production dabao — confirm karo Practice Gravy ka stock badh gaya; ab Practice Curry par Preview stock & cost usey available dikhayega, shortage nahi."],"result":"Real recipe tree Postgres mein save hota hai, explicit output units aur har recipe ka ek atomic save ke saath. Semi-FG tabhi real sellable stock banta hai jab usey actually produce kiya jaaye — production uska apna raw ingredient ek baar consume karta hai; us Semi-FG ko reference karne wali dish bechne par phir produced Semi-FG stock directly consume hota hai, woh raw ingredient dobara kabhi nahi."}},"/warehouse":{"en":{"scenario":"Dispatch stock from Central to a branch, then confirm receipt with a deliberate shortfall.","steps":["As Owner, open Warehouse & Transfers and create a CENTRAL warehouse (if none exists) and a BRANCH warehouse for your test branch.","Click Dispatch Transfer: From Central, To your test branch, pick a raw material, Qty dispatched: 10.","Check Inventory for that branch — stock has NOT changed yet (dispatch is a paper record only).","Click Receive on the DISPATCHED row and enter Qty received: 9. Confirm the branch's Inventory now shows +9, and the transfer shows a 1-unit shortfall."],"result":"A real stock_transfers row moves DISPATCHED → RECEIVED, and branch inventory_stock only changes at the Receive step — proving dispatch alone never touches live stock, and variance is tracked, not silently dropped."},"hinglish":{"scenario":"Central se branch ko stock dispatch karo, phir jaan-boojh kar shortfall ke saath receive confirm karo.","steps":["Owner se Warehouse & Transfers kholo aur CENTRAL warehouse (agar na ho) + apni test branch ka BRANCH warehouse banao.","Dispatch Transfer dabao: From Central, To apni test branch, koi raw material chuno, Qty dispatched: 10.","Us branch ka Inventory check karo — stock abhi NAHI badla (dispatch sirf paper record hai).","DISPATCHED row par Receive dabao aur Qty received: 9 bharo. Confirm karo branch ki Inventory ab +9 dikhti hai, aur transfer mein 1-unit shortfall dikhta hai."],"result":"Real stock_transfers row DISPATCHED → RECEIVED move hoti hai, aur branch inventory_stock sirf Receive step par badalti hai — proof ki dispatch akela kabhi live stock nahi chhuta, aur variance track hoti hai, silently drop nahi hoti."}},"/accounts-gstr":{"en":{"scenario":"In an isolated QA test branch, compare actual GSTR-1 HSN records with filtered staff POS totals. Use Owner or an explicit OFFICIAL_SALES_REPORTS grant; POS_CASHIER alone is insufficient and existing users receive no automatic grant.","steps":["With POS_CASHIER, place 1-2 real POS orders only in the QA branch with branch/company GST state codes configured. As Owner, mark one Owner-only with a reason; the sale and its official record still exist.","As Owner or with explicit OFFICIAL_SALES_REPORTS, open Accounts and GSTR Export, set From/To to the QA order date and select that branch. A POS_CASHIER-only session must not receive official-report access.","Click Generate and review actual HSN-wise rate, qty, taxable value, CGST/SGST/IGST and total, including the Owner-only order. Do not substitute filtered staff POS totals.","Click Export CSV and open the downloaded file; confirm its numbers match the on-screen table."],"result":"The real CSV matches actual completed orders in the selected date/branch scope, including Owner-only orders, not filtered staff totals or mock numbers. Missing GST configuration is counted as excluded, not presented as compliant. Visibility does not remove official records or revoke existing printouts/downloads; Dashboard/Reports now use database-backed permission-scoped data, not mock demos; official exports remain separate actual-record disclosure."},"hinglish":{"scenario":"Isolated QA test branch mein actual GSTR-1 HSN records aur filtered staff POS totals compare karo. Owner ya explicit OFFICIAL_SALES_REPORTS grant chahiye; sirf POS_CASHIER kaafi nahi aur existing users ko auto-grant nahi milta.","steps":["POS_CASHIER se sirf QA branch mein branch/company GST state codes set karke 1-2 real POS orders lagao. Owner se ek order reason dekar Owner-only karo; sale aur official record rehte hain.","Owner ya explicit OFFICIAL_SALES_REPORTS se Accounts ka GSTR Export kholo, From/To QA order ki date aur wahi branch chuno. Sirf POS_CASHIER wale session ko official-report access nahi milna chahiye.","Generate dabao aur actual HSN-wise rate, qty, taxable value, CGST/SGST/IGST aur total dekho, Owner-only order samet. Filtered staff POS totals ko official figures mat maano.","Export CSV dabao aur downloaded file kholo; confirm numbers on-screen table se milte hain."],"result":"Real CSV selected date/branch ke actual completed orders se banta hai, Owner-only orders samet; filtered staff totals ya mock numbers se nahi. Missing GST configuration wale orders excluded count mein hain, compliant nahi. Visibility se official records remove ya existing printouts/downloads revoke nahi hote; Dashboard/Reports ab DB-backed permission-scoped data hain, mock demo nahi; official exports alag actual-record disclosure hain."}}};

const COPY = {
subtitle:["Open a module for its purpose, exact steps and illustrative example. This self-contained guide also works offline.","Module kholo: uska kaam, steps aur example samjho. Yeh self-contained guide offline bhi chalti hai."],
languageLabel:["Language","Bhasha"], themeLabel:["Theme","Theme"], statusTitle:["Implementation status: live, partly live and demo areas","Implementation status: live, partly live and demo areas"],
status:["Dashboard, Reports, MIS branch snapshots, Tasks, Purchase indents/PO/GRN creation, Accounts expenses/payroll/petty cash/settlements/journal-based Balance Sheet and the existing operational modules use PostgreSQL. Shift Management and blind Cash Drop are locally implemented real database flows, not production-live claims: manually start/end and accept handover; physical cash carries forward, Card/UPI/Other are per-run receipts, not transfers. Initial cash float and safe withdrawals are not modeled. No Weekly Off is assumed; leave needs manager approval. Tasks require manual same-branch assignee IDs; no recurring cron, reminders or file-upload storage. MIS uses partial measured-component weights, not employee scores. Food cost is a current recipe/rate estimate, not historical COGS; prime cost is null. Accounts P&L revenue/COGS remain disconnected. Purchase quality decisions/posted markers are local although PASS/PARTIAL can post real stock: reload shows PENDING and repeat can double-post. Vendor returns/refunds are not implemented.","Dashboard, Reports, MIS branch snapshots, Tasks, Purchase indent/PO/GRN creation, Accounts expenses/payroll/petty cash/settlements/journal-based Balance Sheet aur existing operational modules PostgreSQL use karte hain. Shift Management aur blind Cash Drop locally implemented real database flows hain, production-live claim nahi: manual start/end aur handover acceptance; physical cash carry hota hai, Card/UPI/Other per-run receipts hain, transfers nahi. Initial cash float aur safe withdrawals modeled nahi. Weekly Off assume nahi; leave manager approve karega. Tasks mein manual same-branch assignee ID chahiye; recurring cron, reminders aur file-upload storage nahi. MIS partial measured-component weights use karta hai, employee scores nahi. Food cost current recipe/rate estimate hai, historical COGS nahi; prime cost null hai. Accounts P&L revenue/COGS disconnected hain. Purchase quality decision/posted marker local par PASS/PARTIAL real stock post kar sakta hai: reload par PENDING aur repeat se double-post risk. Vendor return/refund implement nahi hain."],
preferences:["Sign in to the app with a 10-digit mobile number, without +91. English is the default language. Choose Hinglish and Light, Dark, Blue or Emerald using the selectors. This guide remembers its own preferences in this browser; app preferences are separate. If browser storage is unavailable, the controls still work for this visit.","App login mein sirf 10-digit mobile number bharo, +91 nahi. English default language hai. Selectors se Hinglish aur Light, Dark, Blue ya Emerald chuno. Yeh guide isi browser mein apni preferences yaad rakhti hai; app preferences alag hain. Browser storage unavailable ho tab bhi controls is visit mein kaam karte hain."],
permissions:["In the app, Owner manages all branches; Branch Admin manages only their own branch and cannot delegate grants they do not hold. Staff need their own branch and module/action permission. This offline guide lists all modules for reference and does not grant app access.","App mein Owner sab branches manage karta hai; Branch Admin sirf apni branch aur apne grants ke andar kaam karta hai. Staff ko apni branch aur module/action permission chahiye. Offline guide reference ke liye sab modules dikhati hai; app access nahi deti."],
flowNote:["Architecture overview only: provider configuration is saved, but automatic reminders, approval buttons, inbound webhooks and the 8AM summary remain pending. Saving a token is not proof of message delivery.","Sirf architecture overview: provider configuration save hoti hai, par auto reminders, approval buttons, inbound webhooks aur 8AM summary pending hain. Token save hona message delivery ka proof nahi."],
footer:["Restaurant HQ ERP · Six example branches, scalable by branch ID. Illustrative examples are not real business records.","Restaurant HQ ERP · Chhe example branches, branch ID se scalable. Examples real business records nahi hain."],

const CATS={frontend:["Daily Operations","Roz ka kaam"],backend:["Purchase / Stock","Purchase / Stock"],finance:["Finance","Finance"],admin:["Admin / Setup","Admin / Setup"],whatsapp:["WhatsApp Connection","WhatsApp Connection"]};
let language="en", theme="light", openKey=null;
try { const l=localStorage.getItem("restaurant-guide-language"); if(["en","hinglish"].includes(l)) language=l; const th=localStorage.getItem("restaurant-guide-theme"); if(["light","dark","blue","emerald"].includes(th))theme=th;}catch{}
const el=id=>document.getElementById(id), tx=pair=>pair[language==="hinglish"?1:0];
function node(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n;}
function chapter(m){return language==="hinglish"?{...m,...m.hinglish}:m;}
function renderDetail(){if(!openKey)return;const base=MODULES.find(m=>m.module+"|"+m.route===openKey),m=chapter(base), target=el("detailContent");target.replaceChildren(node("div",m.route,"route"),node("h2",m.icon+" "+m.title),node("span",(m.status==="mixed"?tx(["Partly live","Kuch hissa real"]):tx(COPY[m.status==="live"?"live":"demo"])),"badge "+(m.status==="live"?"live":"demo")),node("h3",tx(COPY.what)),node("p",m.what),node("h3",tx(COPY.how)));const ul=node("ul","");m.how.forEach(s=>ul.append(node("li",s)));target.append(ul,node("h3",tx(["Try this example — step by step","Yeh example try karo — step by step"])));const ex=EXAMPLES[m.exampleKey||m.route]?.[language],box=node("section","","example");if(ex){box.append(node("p",ex.scenario));const steps=node("ol","");ex.steps.forEach(step=>steps.append(node("li",step)));box.append(steps,node("p",tx(["Expected result: ","Result kya hoga: "])+ex.result),node("small",tx(["Practice instructions only. Real-record steps should be tried in a test branch/account.","Sirf practice instructions. Real-record steps test branch/account mein try karo."])));}else{box.append(node("p",m.example));}target.append(box);}
function render(){document.documentElement.lang=language==="hinglish"?"hi-Latn":"en";document.documentElement.dataset.theme=theme;el("language").value=language;el("theme").value=theme;["subtitle","languageLabel","themeLabel","statusTitle","status","preferences","permissions","flowNote","footer","close"].forEach(id=>el(id).textContent=tx(COPY[id]));el("close").setAttribute("aria-label",tx(COPY.close));el("flow").replaceChildren();[tx(["Staff WhatsApp (planned workflows)","Staff WhatsApp (planned workflows)"]),"→","ChatXFlow API","→","Restaurant HQ ERP","→","PostgreSQL","→",tx(["Owner view","Owner view"])].forEach(s=>el("flow").append(node("span",s)));el("brandingTitle").textContent=tx(["Example: restaurant name and logo","Example: restaurant ka naam aur logo"]);el("brandingSteps").replaceChildren(...BRANDING_STEPS.map(s=>node("li",tx(s))));el("grid").replaceChildren();MODULES.forEach(base=>{const m=chapter(base),b=node("button","","card");b.type="button";const meta=node("div","","meta");meta.append(node("span",m.icon,"icon"),node("span",(m.status==="mixed"?tx(["Partly live","Kuch hissa real"]):tx(COPY[m.status==="live"?"live":"demo"])),"badge "+(m.status==="live"?"live":"demo")));b.append(meta,node("h3",m.title),node("div",tx(CATS[m.cat]),"category"),node("p",m.short),node("span",tx(COPY.tap),"tap"));b.onclick=()=>{openKey=m.module+"|"+m.route;renderDetail();el("detail").showModal();};el("grid").append(b);});renderDetail();}
el("language").onchange=e=>{language=e.target.value;try{localStorage.setItem("restaurant-guide-language",language)}catch{}render();};el("theme").onchange=e=>{theme=e.target.value;try{localStorage.setItem("restaurant-guide-theme",theme)}catch{}render();};el("close").onclick=()=>el("detail").close();el("detail").addEventListener("close",()=>{openKey=null;});render();
</script></body></html>
