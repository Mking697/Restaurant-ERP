<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant HQ ERP — System Guide</title>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}html{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#475569;--border:#cbd5e1;--accent:#2563eb;--tag:#e2e8f0}html[data-theme=dark]{color-scheme:dark;--bg:#020617;--card:#0f172a;--text:#e2e8f0;--muted:#a5b4c8;--border:#334155;--accent:#60a5fa;--tag:#1e293b}html[data-theme=blue]{--bg:#eff6ff;--card:#fff;--text:#172554;--muted:#1e40af;--border:#93c5fd;--accent:#1d4ed8;--tag:#dbeafe}html[data-theme=emerald]{--bg:#ecfdf5;--card:#fff;--text:#022c22;--muted:#065f46;--border:#6ee7b7;--accent:#047857;--tag:#d1fae5}header,main,footer{max-width:1200px;margin:auto;padding:24px}header{text-align:center;padding-top:40px}h1{font-size:clamp(24px,4vw,36px);line-height:1.2}h2{font-size:20px}p{color:var(--muted)}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}.controls label{display:flex;align-items:center;gap:8px}select,button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px}button,select{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.notice,.flow{padding:16px;border:1px solid var(--border);border-radius:12px;background:var(--card);margin:18px 0}.flow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px}.card{padding:20px;text-align:left;border-top:4px solid var(--accent);transition:transform .15s}.card:hover{transform:translateY(-3px)}.card h3{margin:12px 0 8px;font-size:17px}.card p{font-size:13px}.meta{display:flex;justify-content:space-between;align-items:center;gap:8px}.icon{font-size:26px}.badge{background:var(--tag);padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700}.live{color:#065f46;background:#d1fae5}.demo{color:#92400e;background:#fef3c7}.tap{color:var(--accent);font-size:12px}.category{font-size:11px;color:var(--muted)}dialog{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:16px;max-width:680px;width:calc(100% - 32px);max-height:85vh;padding:28px}dialog::backdrop{background:#020617b3}dialog p,dialog li{color:var(--muted)}dialog h3{color:var(--accent);font-size:13px;text-transform:uppercase;letter-spacing:.04em}.close{float:right}.route{font:12px monospace;color:var(--accent)}.example{padding:14px;background:var(--tag);border-radius:8px}.foot{font-size:12px;text-align:center}li{margin-bottom:8px}@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style></head><body><header><h1>🍽️ Restaurant HQ ERP</h1><p id="subtitle"></p><div class="controls"><label><span id="languageLabel"></span><select id="language" aria-label="Language"><option value="en">English</option><option value="hinglish">Hinglish</option></select></label><label><span id="themeLabel"></span><select id="theme" aria-label="Theme"><option value="light">Light</option><option value="dark">Dark</option><option value="blue">Blue</option><option value="emerald">Emerald</option></select></label></div></header><main><section class="notice"><h2 id="statusTitle"></h2><p id="status"></p><p id="preferences"></p><p id="permissions"></p><h2 id="brandingTitle"></h2><ol id="brandingSteps"></ol></section><div class="flow" id="flow"></div><p id="flowNote"></p><div class="grid" id="grid"></div></main><dialog id="detail"><button class="close" id="close" type="button"></button><div id="detailContent"></div></dialog><footer class="foot" id="footer"></footer>
<script>
const MODULES = [{"module":"DASHBOARD_OWNER","route":"/dashboard","icon":"📊","cat":"frontend","status":"pending","title":"Owner Dashboard","short":"Sample branch KPIs and charts; not live business totals.","what":"Compare illustrative sales, inventory value, prime cost, overdue tasks and MIS scores. Branch filtering is a demo presentation filter, not evidence of database isolation.","how":["Select a branch or the compiled view in the branch selector.","Review KPI cards, revenue charts, channel mix and the branch table.","Use Guide Book for workflow details. Dashboard metrics remain sample data, even when Inventory has real stock."],"example":"Illustration: a sample branch shows ₹1,42,500 revenue and four overdue tasks. Do not use these values for business decisions.","hinglish":{"title":"Owner Dashboard","short":"Sample branch KPIs aur charts; live business totals nahi.","what":"Sample sales, inventory value, prime cost, overdue tasks aur MIS compare karo. Branch filter sirf demo presentation hai, database isolation ka proof nahi.","how":["Branch selector se branch ya compiled view chuno.","KPI cards, revenue charts, channel mix aur branch table dekho.","Workflow details ke liye Guide Book kholo. Inventory real hone par bhi dashboard sample data hi hai."],"example":"Example: sample branch mein ₹1,42,500 revenue aur chaar overdue tasks hain. In numbers se business decisions mat lo."}},{"module":"REPORTS","route":"/reports","icon":"📑","cat":"frontend","status":"pending","title":"Reports","short":"Six sample reports with charts, tables and CSV export.","what":"Sales Trend, MIS Scorecard, Food Cost & Menu Margin, Inventory Variance, Cash Reconciliation and Aggregator Reconciliation use mock datasets. They are not connected to live transactions.","how":["Open a report card.","Review its charts and table.","Export CSV downloads the same sample dataset for spreadsheet review."],"example":"Illustration: a ₹420 dish with a sample ₹138 ingredient cost appears in Food Cost. These are demo values, not a verified recipe cost.","hinglish":{"title":"Reports","short":"Charts, tables aur CSV export ke saath chhe sample reports.","what":"Sales Trend, MIS, Food Cost, Inventory Variance, Cash aur Aggregator reports mock data use karti hain. Live transactions connected nahi hain.","how":["Report card kholo.","Charts aur table dekho.","Export CSV se wahi sample dataset spreadsheet ke liye download hota hai."],"example":"Example: ₹420 ki dish aur ₹138 sample ingredient cost Food Cost mein dikhti hai. Yeh demo values hain, verified recipe cost nahi."}},{"module":"MIS_PERFORMANCE","route":"/performance","icon":"🏆","cat":"frontend","status":"pending","title":"MIS Leaderboard","short":"Illustrative staff rankings, completion counts and weighted scores.","what":"The displayed task/delegation/variance/cashier weighting is 40/30/20/10. Scores and timestamps are sample data; live score calculation is pending.","how":["Compare On Time, Delay and Not Done counts.","Review the score chart and table.","Export CSV to inspect the illustrative rankings."],"example":"Illustration: Rahul’s sample score is 93.1%. It is not an assessment of a real employee.","hinglish":{"title":"MIS Leaderboard","short":"Staff ranking, completion counts aur weighted score ka demo.","what":"Task/delegation/variance/cashier weighting 40/30/20/10 dikhayi gayi hai. Scores aur timestamps sample hain; live calculation pending hai.","how":["On Time, Delay aur Not Done counts compare karo.","Score chart aur table dekho.","Sample ranking inspect karne ke liye Export CSV use karo."],"example":"Example: Rahul ka sample score 93.1% hai. Yeh kisi real employee ka assessment nahi."}},{"module":"TASKS_DELEGATION","route":"/tasks","icon":"✅","cat":"frontend","status":"pending","title":"Tasks & Checklists","short":"Try recurring checklists and one-time task delegation.","what":"This interactive demo keeps tasks in browser page state. Reloading resets changes. Automatic recurrence, reminders, file upload storage and task persistence are not connected.","how":["Create a recurring checklist with title, branch, doer, frequency and shift time.","Delegate a one-time task with priority and due time.","Mark Done: evidence selection is optional for recurring tasks and required for delegation. Only the selected file name is retained, not an uploaded file."],"example":"Illustration: create a fridge-check task, then mark it Done. Reloading removes your demo changes; no recurring schedule was created.","hinglish":{"title":"Tasks & Checklists","short":"Recurring checklist aur one-time delegation try karo.","what":"Demo tasks browser page state mein rehte hain. Reload par changes reset hote hain. Auto recurrence, reminders, file storage aur task persistence connected nahi hain.","how":["Title, branch, doer, frequency aur shift time se recurring checklist banao.","Priority aur due time se one-time task saunpo.","Mark Done mein recurring evidence optional aur delegation evidence zaroori hai. Sirf selected file ka naam rehta hai, file upload nahi hoti."],"example":"Example: fridge-check task banao aur Done karo. Reload par changes hat jaayenge; recurring schedule create nahi hua."}},{"module":"INVENTORY","route":"/inventory","icon":"📦","cat":"backend","status":"live","title":"Inventory","short":"Real branch stock, units, minimum/maximum levels and alerts.","what":"Stock records are saved in PostgreSQL. Material names share a common catalog, but quantities and alert levels belong to individual branches. Owner can view all branches; permitted branch staff operate within their own branch.","how":["Choose a permitted branch and review stock.","Add Item: enter name, branch, unit, opening quantity and minimum/maximum levels.","An existing catalog name reuses its material/unit. Below minimum shows Low stock; above a positive maximum shows Overstock.","This screen does not create purchase indents or manage expiry batches."],"example":"Illustration: Chicken at 9 kg against a 20 kg minimum shows Low stock for that branch. Adding stock does not change another branch’s record.","hinglish":{"title":"Inventory","short":"Real branch stock, units, min/max levels aur alerts.","what":"Stock PostgreSQL mein save hota hai. Material catalog common hai, par quantity aur alert levels har branch ke alag hain. Owner sab branches dekh sakta hai; permitted branch staff sirf apni branch mein kaam karte hain.","how":["Permitted branch chuno aur stock dekho.","Add Item mein naam, branch, unit, opening qty aur min/max bharo.","Existing catalog naam par wahi material/unit use hoti hai. Minimum se kam par Low stock; positive maximum se zyada par Overstock aata hai.","Is screen se purchase indent nahi banti aur expiry batches manage nahi hote."],"example":"Example: Chicken 9 kg aur minimum 20 kg ho to us branch mein Low stock dikhta hai. Doosri branch ka stock nahi badalta."}},{"module":"PURCHASE_ORDER","route":"/purchase","icon":"🛒","cat":"backend","status":"pending","title":"Purchase & GRN","short":"Interactive indent, purchase and quality-check demo.","what":"Try the workflow without posting real purchases. Indents, POs and GRNs are page-local mock records. Quality decisions do not update live Inventory, create vendor returns or post Accounts refunds.","how":["Raise an indent, submit for approval, then approve or reject it.","Create a store or general purchase. Try Buy, optional Bill Upload and Material Receive.","Open the GRN quality check and choose Pass, Fail or Partial. The result is a demo only; no stock/refund posting occurs."],"example":"Illustration: mark a demo GRN Partial with 2 kg failed. Its row changes, but live inventory and accounts remain unchanged.","hinglish":{"title":"Purchase & GRN","short":"Indent, purchase aur quality-check ka interactive demo.","what":"Real purchase post kiye bina workflow try karo. Indents, POs aur GRNs page-local mock records hain. Quality decision se live Inventory, vendor return ya Accounts refund nahi banta.","how":["Indent banao, approval ke liye bhejo, phir approve/reject karo.","Store ya general purchase banao. Buy, optional Bill Upload aur Material Receive try karo.","GRN quality check mein Pass, Fail ya Partial chuno. Sirf demo result hai; stock/refund posting nahi hoti."],"example":"Example: demo GRN Partial karo aur 2 kg failed bharo. Row badlegi, par live inventory aur accounts nahi badlenge."}},{"module":"POS_CASHIER","route":"/pos","icon":"💳","cat":"frontend","status":"live","title":"POS / Cashier","short":"Real billing: BOM-driven KOT + GST invoice + 2 counters + multi-currency + WhatsApp Thank You.","what":"Confirming an order checks and atomically deducts its direct raw-material stock plus any already-PRODUCED Semi-FG stock (never a Semi-FG's own embedded raw ingredients) in real branch inventory — insufficient stock, or a Semi-FG that hasn't been produced yet, rejects the whole order, never a partial sale. The order splits into a kitchen KOT (item + qty, no price) and a customer receipt (price + GST). Each branch supports 2 billing counters. An optional foreign payment currency locks its exchange rate at sale time (GST invoice always stays in INR). A customer WhatsApp number triggers a real Thank You message after confirm.","how":["New Order: pick channel, counter (1 or 2), items and tender. Customer name/WhatsApp number are optional.","Confirm Order checks and deducts direct raw + produced Semi-FG stock, and posts the order — a shortfall, or a dish whose Semi-FG hasn't been produced yet (see Menu & BOM's Production panel), rejects the whole order with a 409.","The receipt shows GST (CGST/SGST or IGST) when the branch and company GST state codes are configured, else it bills tax-free with a clear note.","Pick a non-INR payment currency (configured via the Owner-only Currency Rates panel) to also show the payable amount in that currency alongside the INR invoice total."],"example":"Example: 2 plates of Butter Chicken on Counter 2, paid in USD. Receipt shows ₹363.20 (GST invoice, incl. 5% GST) and Payable in USD: $4.30 (rate locked at ₹84.50). Real direct raw material (chicken) + already-produced Semi-FG gravy stock both deduct from that branch's inventory — the gravy's own raw ingredients were already consumed when it was produced, not again at sale.","hinglish":{"title":"POS / Cashier","short":"Real billing: BOM-driven KOT + GST invoice + 2 counters + multi-currency + WhatsApp Thank You.","what":"Order confirm karte hi uska direct raw-material stock aur jo bhi Semi-FG pehle se PRODUCE ho chuka hai uska stock check+deduct hota hai (Semi-FG ke apne embedded raw ingredients kabhi dobara nahi) — stock kam ho, ya koi Semi-FG abhi produce nahi hua, to poora order reject hota hai, kabhi partial sale nahi. Order 2 jagah split hota hai: kitchen ke liye KOT (item+qty, price nahi) aur customer ke liye receipt (price+GST). Har branch mein 2 billing counters hain. Optional foreign payment currency sale time par apna FX rate lock kar leti hai (GST invoice hamesha INR mein). Customer WhatsApp number do to confirm hote hi real Thank You message jaata hai.","how":["New Order: channel, counter (1 ya 2), items aur tender chuno. Customer naam/WhatsApp number optional hain.","Confirm Order direct raw + produced Semi-FG stock check+deduct karta hai aur order post karta hai — kami ho, ya kisi dish ka Semi-FG abhi produce na hua ho (Menu & BOM ke Production panel se produce karo), to 409 ke saath poora order reject.","Receipt GST dikhati hai (CGST/SGST ya IGST) jab branch aur company ke GST state code set hon, warna clear note ke saath tax-free bill ban jaata hai.","Non-INR payment currency chuno (Owner-only Currency Rates panel se configured) to INR invoice total ke saath us currency mein payable amount bhi dikhta hai."],"example":"Example: 2 plate Butter Chicken Counter 2 par, USD mein payment. Receipt ₹363.20 (GST invoice, 5% GST samet) aur Payable in USD: $4.30 (rate lock ₹84.50) dikhati hai. Real direct raw material (chicken) + pehle se produced Semi-FG gravy dono stock us branch ki inventory se minus hote hain — gravy ka apna raw ingredient production ke time hi consume ho chuka tha, sale par dobara nahi."}},{"module":"CASH_DROP","route":"/cash-drop","icon":"🔒","cat":"frontend","status":"pending","title":"Blind Cash Drop","short":"Count denominations and submit an illustrative closing total.","what":"The page totals notes and coins locally. No expected-cash API, saved cash-drop record or shortage/excess calculation is connected yet. Do not treat demo submission as shift closure.","how":["Enter counts for each note denomination.","Add the total coin value.","Submit Cash Drop to see the counted total. Reloading resets it."],"example":"Illustration: a counted ₹18,350 is displayed after submission. No shortage is calculated and no closing entry is saved.","hinglish":{"title":"Blind Cash Drop","short":"Notes aur coins gino aur sample closing total submit karo.","what":"Page notes aur coins locally total karta hai. Expected-cash API, saved cash-drop record aur shortage/excess calculation connected nahi hain. Demo submission ko shift closure mat samjho.","how":["Har denomination ke notes ki ginti bharo.","Coins ki total value bharo.","Submit Cash Drop se counted total dekho. Reload par reset hota hai."],"example":"Example: submission ke baad gina hua ₹18,350 dikhta hai. Shortage calculate ya closing entry save nahi hoti."}},{"module":"ACCOUNTS_EXPENSES","route":"/accounts","icon":"💰","cat":"finance","status":"mixed","title":"Accounts","short":"Real branch expenses and payroll costs; other accounting areas remain clearly marked demos.","what":"Permitted accountants enter Rent, Utilities, Marketing and Other operating expenses with branch, date, amount and reference. Expenses persist and can be voided with a reason. P&L shows actual posted expenses and finalized salary snapshots. Sales and food-cost integration remain pending, so gross/net profit are not invented. Petty cash, aggregator reconciliation and balance-sheet areas remain demo or pending, as labelled.","how":["Choose branch and month, then open Expenses or P&L.","Add an expense with category, date, subcategory, amount, description and bill/reference; save and reload to confirm persistence.","Use Void with a reason to reverse an incorrect expense without deleting its history. Do not enter payroll again as an operating expense: finalized payroll supplies labor cost."],"example":"Example: save ₹5,000 Rent for a test branch in September. Its real September rent total increases by ₹5,000. Net profit remains unavailable until sales and COGS are connected.","hinglish":{"title":"Accounts","short":"Real branch expenses aur payroll costs; baaki accounting areas labelled demo hain.","what":"Permission wala accountant Rent, Utilities, Marketing aur Other expense branch/date/amount/reference ke saath daalta hai. Expenses save hote hain aur reason dekar Void kiye ja sakte hain. P&L mein real expenses aur finalized salary cost aati hai. Sales/food-cost integration pending hai, isliye gross/net profit invent nahi hota. Baaki accounting areas par demo/pending label dekho.","how":["Branch aur month chuno, phir Expenses ya P&L kholo.","Category, date, subcategory, amount, description aur bill/reference se expense add karo; save ke baad reload se persistence check karo.","Galat expense ko reason dekar Void karo; history delete nahi hoti. Salary dobara expense mein mat daalo: finalized payroll se labor cost aati hai."],"example":"Example: test branch mein September ka ₹5,000 Rent save karo. Real rent total ₹5,000 badhega. Sales/COGS connect hone tak Net Profit unavailable rahega."}},{"module":"PAYROLL","route":"/workforce","icon":"👥","cat":"finance","status":"live","title":"Staff, Attendance & Payroll","short":"Real employee rates, daily attendance, approved leave and monthly salary snapshots.","what":"Set ON_ROLL monthly salary or OFF_ROLL daily wages once. There is no Weekly Off status. Present is one unit, Half Day is half, Absent is zero. Employees apply leave; an authorized manager other than the applicant approves or rejects. Only approved paid ON_ROLL leave contributes paid units. OFF_ROLL leave is unpaid. ON_ROLL uses the actual calendar days in each month, including leap years. Missing attendance blocks finalization. Final payroll is immutable and does not transfer money. After ANY leave history (PENDING/APPROVED/REJECTED), the employee login link cannot be assigned, replaced or cleared, even by Owner. Keeping the existing link and other safe edits are allowed.","how":["With PAYROLL access, create an employee in a test branch, set employment type/rate/join date and optionally link their same-branch login for self-service leave.","With ATTENDANCE access, mark each eligible day Present, Half Day or Absent. Approved leave is shown separately and cannot be double marked.","Employee applies leave with dates/reason. A different authorized reviewer selects Approved or Rejected; paid/unpaid is explicit for on-roll, off-roll leave stays unpaid.","Preview a completed month, resolve missing dates and finalize a single branch. Final payroll feeds P&L labor cost once; future rate changes take effect from an explicit future month boundary."],"example":"Example: September has 30 days. A ₹30,000 monthly employee with 29 Present days and one approved Paid Leave earns ₹30,000. An ₹800 daily-wage employee with 20 full days and one half-day earns ₹16,400; all other eligible dates must be marked/covered before finalizing.","hinglish":{"title":"Staff, Attendance aur Salary","short":"Real employee rates, daily attendance, approved leave aur monthly salary snapshots.","what":"ON_ROLL ki monthly salary ya OFF_ROLL ki daily wage ek baar set karo. Weekly Off status nahi hai. Present 1, Half Day 0.5, Absent 0 units. Employee leave apply karta hai; applicant se alag authorized manager approve/reject karta hai. Sirf approved paid ON_ROLL leave paid units mein aati hai. OFF_ROLL leave unpaid hai. ON_ROLL calculation actual 28/29/30/31 calendar days se hoti hai. Missing attendance par finalization blocked; final payroll immutable hai, paisa transfer nahi hota. Koi bhi leave history (PENDING/APPROVED/REJECTED) hone ke baad employee login link assign, replace ya clear nahi kar sakte, Owner bhi nahi. Existing link rakhna aur doosre safe edits allowed hain.","how":["PAYROLL access se test branch mein employee banao; employment type/rate/join date set karo aur self-service leave ke liye same-branch login optionally link karo.","ATTENDANCE access se har eligible din Present, Half Day ya Absent mark karo. Approved leave alag dikhti hai aur double attendance mark nahi hoti.","Employee dates/reason se leave apply kare. Doosra authorized reviewer Approved/Rejected chune; on-roll par paid/unpaid explicit, off-roll leave unpaid rahegi.","Completed month preview karo, missing dates resolve karke single branch finalize karo. Salary cost P&L mein ek baar aati hai; rate change explicit future month se hota hai."],"example":"Example: September mein 30 din hain. ₹30,000 monthly employee ke 29 Present aur 1 approved Paid Leave par ₹30,000 bante hain. ₹800 daily wage ke 20 full aur 1 half-day par ₹16,400. Finalize se pehle baaki eligible dates bhi marked/covered honi chahiye."}},{"module":"USER_ADMIN","route":"/admin/users","icon":"👥","cat":"admin","status":"live","title":"Users & Access","short":"Create real users with roles, branch assignment and module grants.","what":"Owner manages all branches and HQ roles. Branch Admin manages only own-branch users and cannot grant more access than they hold, edit themselves or create HQ roles. Server-side permissions govern real records.","how":["New User: enter name, 10-digit mobile number (without +91), a password of at least 12 characters, role and branch.","Select allowed module grants and save. Branch Admin sees only delegable grants.","Edit a user to change access/status/password. Saved changes revoke the user’s existing sessions; blank password retains the existing password."],"example":"Illustration: give a cashier only POS and Cash Drop grants. Other modules remain inaccessible; grants do not make demo modules database-backed.","hinglish":{"title":"Users & Access","short":"Real users banao: role, branch aur module grants ke saath.","what":"Owner sab branches aur HQ roles manage karta hai. Branch Admin sirf apni branch ke users manage karta hai; apne se zyada grants nahi de sakta, khud ko edit ya HQ role create nahi kar sakta. Server permissions real records par lagti hain.","how":["New User mein naam, 10-digit mobile number (without +91), kam se kam 12-character password, role aur branch bharo.","Allowed module grants chuno aur save karo. Branch Admin ko sirf delegable grants dikhte hain.","Edit se access/status/password badlo. Save par purane sessions revoke hote hain; blank password par purana password rehta hai."],"example":"Example: cashier ko sirf POS aur Cash Drop grants do. Doosre modules accessible nahi honge; grants demo modules ko DB-backed nahi banate."}},{"module":"BRANCH_ADMIN","route":"/admin/branches","icon":"🏢","cat":"admin","status":"live","title":"Branches","short":"Real branch records; only Owner creates branches.","what":"Owner can create and edit branches. Branch Admin sees and maintains only their own branch. Creating a branch does not clone menus, recipes, checklists or stock. The clone wizard is not implemented.","how":["Owner: New Branch, then enter code, name, address, coordinates and geofence radius.","Edit a permitted row and save. The screen reads the saved record back from PostgreSQL.","New branches start empty. Branch deletion is not offered by this screen."],"example":"Illustration: Owner creates B7 — Vasant Kunj. It becomes a real branch option in user administration; no menu or stock is copied.","hinglish":{"title":"Branches","short":"Real branch records; sirf Owner nayi branch banata hai.","what":"Owner branches create/edit kar sakta hai. Branch Admin sirf apni branch dekhta aur maintain karta hai. Branch banane se menu, recipes, checklist ya stock clone nahi hote. Clone wizard implement nahi hai.","how":["Owner: New Branch mein code, naam, address, coordinates aur geofence radius bharo.","Permitted row Edit karke save karo. Screen PostgreSQL se saved record dobara padhti hai.","Nayi branch khali shuru hoti hai. Is screen par branch delete option nahi hai."],"example":"Example: Owner B7 — Vasant Kunj banata hai. User administration mein real branch option aata hai; menu ya stock copy nahi hota."}},{"module":"WHATSAPP_LOGS","route":"/admin/settings/whatsapp","icon":"📲","cat":"whatsapp","status":"live","title":"WhatsApp Settings (ChatXFlow)","short":"Owner-only provider configuration saved in the real database.","what":"Connect a number in ChatXFlow, then save the provider token, phone and pinned base URL here. Saving credentials does not enable task reminders, approval messages, 8AM summaries or inbound webhooks; these automation workflows are still pending.","how":["Owner: connect the WhatsApp number using ChatXFlow’s own QR flow.","Paste the Developer API Token and set the WhatsApp phone number.","Save Settings. Leave the token blank to retain an existing saved token. Custom hosts are not allowed."],"example":"Illustration: Owner saves provider settings. This proves configuration storage only, not automatic delivery of task reminders or approval buttons.","hinglish":{"title":"WhatsApp Settings (ChatXFlow)","short":"Owner-only provider configuration real database mein save hoti hai.","what":"ChatXFlow mein number connect karo, phir provider token, phone aur fixed base URL yahan save karo. Credentials save karne se task reminders, approval messages, 8AM summary ya inbound webhooks enable nahi hote; yeh automation pending hain.","how":["Owner: ChatXFlow ke apne QR flow se WhatsApp number connect karo.","Developer API Token paste karo aur WhatsApp phone number set karo.","Save Settings dabao. Existing token rakhne ke liye token blank chhodo. Custom hosts allowed nahi hain."],"example":"Example: Owner provider settings save karta hai. Isse sirf configuration storage verify hoti hai, automatic reminders ya approval buttons ki delivery nahi."}},{"module":"MENU_BOM","route":"/menu","icon":"🍲","cat":"backend","status":"live","title":"Menu & BOM","short":"Real dish recipes with explicit units, live stock preview, and real Semi-FG production stock.","what":"Create menu items (sellable dishes, or Semi-FG bases like gravy/marinade that are not directly orderable) with an explicit output unit (portion/kg/ltr/pcs). Recipe Builder saves the whole recipe — multiple ingredient rows, each a raw material OR an existing same-branch Semi-FG, normalized per one output unit — in one atomic save; saving a recipe never touches stock. A cycle (A needs B needs A) is rejected at save time. A Semi-FG dish only has real stock after it is actually PRODUCED (its own panel on this page) — production consumes the Semi-FG's own direct raw/nested-Semi-FG ingredients and credits prepared stock. Selling a dish then consumes its direct raw materials plus any produced Semi-FG stock directly — never the Semi-FG's embedded raw ingredients a second time. Preview stock & cost shows the theoretical raw-cost rollup (planning estimate) alongside what will ACTUALLY be consumed (direct raw + direct Semi-FG, with required/available/shortage) — it is a preview only, never a reservation.","how":["Recipe Builder: enter the dish/Semi-FG name, branch, price (for sellable dishes), output unit and batch yield, then add ingredient rows (search, pick raw material or Semi-FG, enter batch quantity) — one Save writes the dish and its whole recipe together.","Preview stock & cost on a saved recipe: shows the theoretical raw-material rollup/cost estimate, and separately the direct raw + Semi-FG stock this item will actually consume, with any shortage.","Semi-FG production & stock panel: pick a Semi-FG and an output quantity, Record production — this is the only action that credits real prepared stock; selling a dish never substitutes for production.","POS then only needs direct raw material stock and any already-produced Semi-FG stock on hand — a dish referencing an unproduced Semi-FG is blocked from sale until it's produced."],"example":"Example: Butter Chicken needs 0.1kg Gravy (Semi-FG) + 0.25kg Chicken per portion. Gravy's own recipe needs Tomato + Butter. Producing 1kg of Gravy consumes that Tomato/Butter directly and credits 1kg to Gravy's Semi-FG stock; selling 10 plates of Butter Chicken then consumes 1kg of that Gravy stock plus 2.5kg Chicken — never the Gravy's Tomato/Butter again.","hinglish":{"title":"Menu aur BOM","short":"Real dish recipes explicit units ke saath, live stock preview, aur real Semi-FG production stock.","what":"Menu items banao (sellable dish, ya Semi-FG base jaise gravy/marinade jo directly order nahi hoti) explicit output unit (portion/kg/ltr/pcs) ke saath. Recipe Builder poori recipe ek saath save karta hai — multiple ingredient rows, har ek raw material YA existing isi-branch ka Semi-FG, 1 output unit ke hisaab se normalized — ek atomic save mein; recipe save karne se stock kabhi nahi badalta. Cycle (A ko B chahiye, B ko A chahiye) save time par reject hota hai. Semi-FG dish ka real stock tabhi hota hai jab usey actually PRODUCE kiya jaye (isi page par apna panel) — production us Semi-FG ke apne direct raw/nested-Semi-FG ingredients consume karke prepared stock credit karta hai. Dish bechne par uska direct raw material + jo bhi produced Semi-FG stock available hai, wahi directly consume hota hai — Semi-FG ke embedded raw ingredients dobara kabhi nahi. Preview stock & cost theoretical raw-cost rollup (planning estimate) ke saath yeh bhi dikhata hai ki ACTUALLY kya consume hoga (direct raw + direct Semi-FG, required/available/shortage ke saath) — yeh sirf preview hai, reservation nahi.","how":["Recipe Builder: dish/Semi-FG naam, branch, price (sellable dish ke liye), output unit aur batch yield bharo, phir ingredient rows add karo (search karo, raw material ya Semi-FG chuno, batch quantity daalo) — ek Save se dish aur poori recipe ek saath save hoti hai.","Saved recipe par Preview stock & cost: theoretical raw-material rollup/cost estimate aur alag se direct raw + Semi-FG stock dikhata hai jo yeh item actually consume karega, shortage samet.","Semi-FG production & stock panel: Semi-FG aur output quantity chuno, Record production — yahi ek action hai jo real prepared stock credit karta hai; dish bechna production ka substitute kabhi nahi.","POS ko ab sirf direct raw material stock aur jo bhi Semi-FG pehle se produced hai, wahi chahiye — agar Semi-FG abhi produce nahi hua to us par depend karne wali dish ki sale block ho jayegi jab tak produce na ho."],"example":"Example: Butter Chicken ko per portion 0.1kg Gravy (Semi-FG) + 0.25kg Chicken chahiye. Gravy ki apni recipe mein Tomato + Butter chahiye. 1kg Gravy produce karne se wahi Tomato/Butter directly consume hota hai aur Gravy ke Semi-FG stock mein 1kg credit hota hai; 10 plate Butter Chicken bechne se us 1kg Gravy stock + 2.5kg Chicken consume hota hai — Gravy ka Tomato/Butter dobara kabhi nahi."}},{"module":"INVENTORY","route":"/warehouse","icon":"🏭","cat":"backend","status":"live","title":"Warehouse & Transfers","short":"Real 2-level stock: Central warehouse dispatches, branch confirms receipt.","what":"Owner creates one CENTRAL warehouse plus one BRANCH warehouse per branch. Dispatching a stock transfer (Central → Branch only) is a paper/audit record — it does NOT move any quantity by itself, since the central warehouse has no live quantity ledger yet. Receiving is the ONLY step that mutates real branch inventory_stock; any shortfall between dispatched and received quantity is recorded as transit variance.","how":["Owner: New Warehouse to create the CENTRAL warehouse and each branch's BRANCH warehouse.","Dispatch Transfer: pick the Central source, the destination branch, a raw material and quantity dispatched.","On the branch side, Receive: enter the actual quantity received — this is the step that adds to that branch's real stock.","A received quantity less than dispatched shows as a shortfall; it's recorded, not auto-blocked or auto-refunded."],"example":"Example: Central dispatches 50 kg Rice to Branch B2. Branch stock does NOT change yet. B2 receives 48 kg — now B2's real inventory gets +48 kg, and a 2 kg shortfall is recorded against that transfer.","hinglish":{"title":"Warehouse aur Transfer","short":"Real 2-level stock: Central warehouse dispatch karta hai, branch receipt confirm karti hai.","what":"Owner ek CENTRAL warehouse aur har branch ka ek BRANCH warehouse banata hai. Stock transfer dispatch (sirf Central → Branch) ek paper/audit record hai — khud se koi quantity move nahi karta, kyunki central warehouse ka abhi koi live quantity ledger nahi hai. Receive hi aisa step hai jo real branch inventory_stock badalta hai; dispatched aur received quantity ke beech kami transit variance ki tarah record hoti hai.","how":["Owner: New Warehouse se CENTRAL warehouse aur har branch ka BRANCH warehouse banao.","Dispatch Transfer: Central source, destination branch, raw material aur dispatched quantity chuno.","Branch side par Receive: actual received quantity bharo — yahi step branch ki real stock mein add karta hai.","Received quantity dispatched se kam ho to shortfall dikhta hai; yeh sirf record hota hai, auto-block ya auto-refund nahi."],"example":"Example: Central 50 kg Rice Branch B2 ko dispatch karta hai. Branch stock abhi nahi badalti. B2 48 kg receive karta hai — ab B2 ki real inventory mein +48 kg add hota hai, aur 2 kg shortfall us transfer ke against record hoti hai."}},{"module":"POS_CASHIER","route":"/gst-export","icon":"🧾","cat":"finance","status":"live","title":"GSTR-1 HSN Summary Export","short":"Real GSTR-1 Table 12 style HSN-wise export, built from actual completed orders.","what":"Pick a date range and branch scope; the page pulls every real completed order in range, groups taxable value + CGST/SGST/IGST by HSN/SAC code and rate, and lets you export it as CSV ready for the GST portal's offline tool. Orders from a branch (or before the company) had its GST state code configured are excluded from the summary and counted separately — a GSTR filing never silently includes tax-free sales as if they were GST-compliant.","how":["Pick From/To dates and (optionally) a branch, then Generate.","Review the HSN-wise table: rate, quantity, taxable value, CGST/SGST/IGST, total tax and total value, with a Grand Total row.","If any orders in range are excluded for missing GST configuration, a clear warning states exactly how many.","Export CSV downloads the exact on-screen summary."],"example":"Example: two orders in October both have menu items under HSN 2106 at 5% GST — the export merges them into one row: Qty 3, Taxable ₹400.00, CGST ₹10.00, SGST ₹10.00, Total ₹420.00.","hinglish":{"title":"GSTR-1 HSN Summary Export","short":"Real GSTR-1 Table 12 jaisa HSN-wise export, real completed orders se bana.","what":"Date range aur branch scope chuno; page us range ke saare real completed orders uthati hai, HSN/SAC code aur rate ke hisaab se taxable value + CGST/SGST/IGST group karti hai, aur CSV export deti hai jo GST portal ke offline tool mein seedha ja sake. Jin branch (ya jab tak company) ka GST state code configure nahi tha unke orders summary se exclude hote hain aur alag count hote hain — GSTR filing mein kabhi tax-free sales GST-compliant jaisi silently nahi dikhti.","how":["From/To dates aur (optional) branch chuno, phir Generate dabao.","HSN-wise table dekho: rate, quantity, taxable value, CGST/SGST/IGST, total tax aur total value, saath mein Grand Total row.","Agar range ke kuch orders GST configuration na hone ki wajah se exclude hue hain, ek clear warning exact count batati hai.","Export CSV se wahi on-screen summary download hoti hai."],"example":"Example: October ke 2 orders dono mein HSN 2106 @ 5% GST ke menu items hain — export unhe ek row mein merge karta hai: Qty 3, Taxable ₹400.00, CGST ₹10.00, SGST ₹10.00, Total ₹420.00."}}];
const EXAMPLES = {"/dashboard":{"en":{"scenario":"You own six branches and want to compare today's sample performance.","steps":["Open Owner Dashboard and select All branches (compiled).","Read Total Sales and Total Inventory Value, then scroll to the branch comparison table.","Select Connaught Place in the branch selector and compare its displayed KPIs with the compiled view.","Return to All branches. No sales or inventory records are changed by viewing these charts."],"result":"The displayed sample KPIs change with the branch selection. They do not become live accounting figures: this dashboard is a demo, even though Inventory uses the database."},"hinglish":{"scenario":"Aapki chhe branches hain aur aaj ki sample performance compare karni hai.","steps":["Owner Dashboard kholo aur All branches (compiled) chuno.","Total Sales aur Total Inventory Value dekho, phir neeche branch comparison table padho.","Branch selector mein Connaught Place chuno aur uske KPIs ko compiled view se compare karo.","Wapas All branches chuno. Charts dekhne se sales ya inventory records nahi badalte."],"result":"Branch selection ke saath sample KPIs badlenge. Yeh live accounting numbers nahi hain: Inventory DB-backed hone par bhi dashboard abhi demo hai."}},"/reports":{"en":{"scenario":"You want to review sample dish costs and share the report in a spreadsheet.","steps":["Open Reports, then the Food Cost & Menu Margin report card.","Pick a sample dish row and compare its selling price with ingredient cost and margin.","Click Export CSV and open the downloaded file in Excel or another spreadsheet app.","Compare the exported rows with the report table. Do not use this sample report to change actual menu prices."],"result":"A CSV containing the report's sample rows is downloaded. Exporting does not create or change a real purchase, recipe or financial record."},"hinglish":{"scenario":"Sample dish cost dekhni hai aur report spreadsheet mein share karni hai.","steps":["Reports kholo, phir Food Cost & Menu Margin card kholo.","Kisi sample dish ka selling price, ingredient cost aur margin compare karo.","Export CSV dabao aur downloaded file Excel ya kisi spreadsheet app mein kholo.","Exported rows ko report table se milao. Sample report se asli menu prices mat badlo."],"result":"Report ki sample rows wali CSV download hogi. Export se real purchase, recipe ya financial record create/change nahi hota."}},"/performance":{"en":{"scenario":"You want to understand why one sample employee ranks above another.","steps":["Open MIS Leaderboard and find Rahul Sharma's sample row.","Read On Time, Delay and Not Done counts together, not just the rank.","Compare his score with another employee and the chart. The shown task/delegation/variance/cashier weights are 40/30/20/10.","Use Export CSV to review the sample ranking outside the app."],"result":"You can explain the displayed ranking and counts. These are illustrative scores, not a live performance assessment or an automatically calculated payroll result."},"hinglish":{"scenario":"Samajhna hai ki ek sample employee ki ranking doosre se upar kyun hai.","steps":["MIS Leaderboard kholo aur Rahul Sharma ki sample row dekho.","Sirf rank nahi, On Time, Delay aur Not Done counts saath mein padho.","Doosre employee aur chart se score compare karo. Task/delegation/variance/cashier weights 40/30/20/10 dikhaye gaye hain.","App ke bahar ranking dekhne ke liye Export CSV use karo."],"result":"Displayed ranking aur counts samajh aayenge. Yeh sample scores hain, live employee assessment ya automatic payroll result nahi."}},"/tasks":{"en":{"scenario":"Assign a one-time fridge-cleaning task and demonstrate the evidence requirement.","steps":["Click Delegate Task. Title: Clean fridge; Branch: Connaught Place; Assign to: Rahul Sharma.","Choose HIGH priority and a future due date/time, then create the task.","Find the new row and click Mark Done. Without selecting an attachment, submission stays blocked.","Select a non-sensitive sample image and click Mark Done. For a recurring/checklist task, evidence selection is optional instead."],"result":"The demo row changes to Done. Only the selected file name is kept in page state; no file is uploaded, no reminder is scheduled, and reloading resets the demo changes."},"hinglish":{"scenario":"Fridge saaf karne ka one-time task do aur evidence rule samjho.","steps":["Delegate Task dabao. Title: Clean fridge; Branch: Connaught Place; Assign to: Rahul Sharma.","HIGH priority aur future due date/time chuno, phir task banao.","Nayi row ka Mark Done dabao. Attachment select kiye bina submit blocked rahega.","Koi non-sensitive sample image select karo aur Mark Done dabao. Recurring/checklist task mein evidence optional hai."],"result":"Demo row Done ho jaayegi. Sirf file ka naam page state mein rehta hai; file upload, reminder schedule ya DB save nahi hota. Reload par demo changes reset hote hain."}},"/inventory":{"en":{"scenario":"Add a new practice ingredient with low opening stock in a permitted branch.","steps":["Choose your permitted branch and click Add Item.","Name: Practice Ingredient (use a new name); Unit: kg; Opening quantity: 9; Minimum: 20; Maximum: 60.","Select the intended branch and save. Do this only in a test branch: this screen writes real database records.","Check that the row shows 9 kg and Low stock. Reload the page to confirm it remains saved."],"result":"This branch has a persisted stock row and a low-stock alert because 9 is below 20. Another branch's stock is unchanged. This is a real write, not a disposable page-only demo."},"hinglish":{"scenario":"Permitted branch mein kam opening stock wala naya practice ingredient add karo.","steps":["Apni permitted branch chuno aur Add Item dabao.","Name: Practice Ingredient (naya naam lo); Unit: kg; Opening quantity: 9; Minimum: 20; Maximum: 60.","Sahi branch select karke save karo. Sirf test branch mein try karo: yeh screen real DB record likhti hai.","Row mein 9 kg aur Low stock dekho. Reload karke confirm karo ki record save hai."],"result":"Is branch ka stock save hoga aur 9, minimum 20 se kam hone ke kaaran alert aayega. Doosri branch ka stock nahi badlega. Yeh real DB write hai, page-only demo nahi."}},"/purchase":{"en":{"scenario":"Try buying a general item without a store indent, then inspect the quality-check flow.","steps":["Click New Purchase and select General purchase.","Branch: Connaught Place; Vendor: Practice Repairs; Item description: Office chair repair; Amount: ₹500. Click Create (Step 1: Buy).","In Purchase Orders, try the optional bill step and then Mark Material Received. Inspect the resulting demo GRN.","Open a pending GRN's Quality Check. Try Pass, or Partial/Fail with a failure quantity in the displayed unit."],"result":"The local PO/GRN progress and quality result change. No live inventory, vendor return, refund or Accounts entry is posted. Reloading restores the sample data."},"hinglish":{"scenario":"Store indent ke bina general item purchase try karo, phir quality check dekho.","steps":["New Purchase dabao aur General purchase chuno.","Branch: Connaught Place; Vendor: Practice Repairs; Item description: Office chair repair; Amount: ₹500. Create (Step 1: Buy) dabao.","Purchase Orders mein optional bill step aur phir Mark Material Received try karo. Bani hui demo GRN dekho.","Pending GRN ka Quality Check kholo. Pass try karo, ya displayed unit mein fail quantity bharke Partial/Fail chuno."],"result":"Local PO/GRN progress aur quality result badlega. Live stock, vendor return, refund ya Accounts posting nahi hogi. Reload par sample data wapas aayega."}},"/pos":{"en":{"scenario":"Place a real dine-in order for a dish with a configured BOM, paid by UPI, in a test branch.","steps":["Open POS / Cashier, select a test branch and click New Order.","Channel: DINE_IN; Counter: Counter 1; pick a sellable dish that has at least one BOM line; Qty: 2; Tender: UPI.","Click Confirm Order. If branch raw material stock is below what the BOM needs, the whole order is rejected with a 409 — top up Inventory first.","Open Inventory for that branch and confirm the raw material quantity actually decreased by the BOM's recipe amount × 2."],"result":"A real pos_orders row is saved with a KOT (item+qty, no price) and a receipt (price+GST if configured). Branch inventory_stock is really deducted — this is not a page-only demo. Reloading does not undo it."},"hinglish":{"scenario":"Test branch mein BOM-configured dish ka real dine-in order UPI se lagao.","steps":["POS / Cashier kholo, test branch chuno aur New Order dabao.","Channel: DINE_IN; Counter: Counter 1; koi sellable dish chuno jiska kam se kam ek BOM line ho; Qty: 2; Tender: UPI.","Confirm Order dabao. Agar branch ka raw material BOM ki zarurat se kam hai, poora order 409 ke saath reject hoga — pehle Inventory top up karo.","Us branch ka Inventory kholo aur confirm karo raw material qty BOM ke recipe amount × 2 jitni kam hui."],"result":"Real pos_orders row save hoti hai KOT (item+qty, price nahi) aur receipt (price+GST agar configured) ke saath. Branch inventory_stock real mein minus hoti hai — yeh page-only demo nahi. Reload isse undo nahi karta."}},"/cash-drop":{"en":{"scenario":"Count an illustrative shift-closing cash total of ₹6,550.","steps":["Enter 10 notes in the ₹500 field: ₹5,000.","Enter 5 notes in ₹200 and 5 notes in ₹100: another ₹1,500. Leave other denominations at zero.","Enter ₹50 as the total value of coins, not the number of coins.","Confirm the total is ₹6,550 and click Submit Cash Drop."],"result":"The page displays the counted ₹6,550. This demo does not fetch expected cash, calculate shortage/excess or save a real shift-closing entry."},"hinglish":{"scenario":"Shift closing ka sample cash ₹6,550 gino.","steps":["₹500 field mein 10 notes bharo: ₹5,000.","₹200 mein 5 aur ₹100 mein 5 notes bharo: aur ₹1,500. Baaki denominations zero rakho.","Coins mein ₹50 total value bharo, coins ki ginti nahi.","Total ₹6,550 confirm karke Submit Cash Drop dabao."],"result":"Page par counted ₹6,550 dikhega. Demo expected cash fetch, shortage/excess calculation ya real shift-closing entry save nahi karta."}},"/accounts":{"en":{"scenario":"Enter a real ₹5,000 branch rent expense and inspect its month total. Practice only in a test branch.","steps":["Open Accounts, select a test branch and the intended month, then choose Expenses.","Add expense: category RENT, date within that month, amount ₹5,000, description Test branch rent, and your bill/reference.","Save, reload and find the posted record. Open P&L for the same branch/month and check Rent.","If this was a practice mistake, Void the expense with a reason; retain its history rather than entering an offsetting duplicate."],"result":"A real database expense increases Rent by ₹5,000 and a void excludes it from totals. Finalized payroll contributes Labor Cost separately. Revenue/COGS and gross/net profit remain unavailable until sales/stock posting are connected; no sample profit is mixed in."},"hinglish":{"scenario":"Real ₹5,000 branch rent daalo aur month total dekho. Practice sirf test branch mein karo.","steps":["Accounts kholo, test branch aur sahi month chuno, phir Expenses kholo.","Expense add karo: category RENT, us month ki date, amount ₹5,000, description Test branch rent aur bill/reference.","Save, reload aur posted record dekho. Same branch/month ka P&L kholkar Rent check karo.","Practice mein galti hui ho to reason dekar Void karo; duplicate offset entry mat daalo, history rakho."],"result":"Real DB expense se Rent ₹5,000 badhta hai; Void par total se exclude hota hai. Finalized payroll ki Labor Cost alag aati hai. Sales/stock posting connect hone tak Revenue/COGS aur gross/net profit unavailable hain; sample profit mix nahi hota."}},"/workforce":{"en":{"scenario":"Calculate September salary for one monthly employee and one daily-wage employee in a test branch. Prerequisites: link employee A to a same-branch login with LEAVE_SELF; the attendance marker needs ATTENDANCE, and a DIFFERENT reviewer needs LEAVE_APPROVAL. Neither the linked employee nor the request submitter may review, including Owner.","steps":["With PAYROLL access, create ON_ROLL employee A at ₹30,000 per month and OFF_ROLL employee B at ₹800 per day, joined on September 1. Use a completed September, not a future month.","Mark A Present for 29 days; A applies one day leave and a different authorized manager approves it as PAID. No Weekly Off is assumed.","For B, mark 20 full Present days and one Half Day; mark the other eligible days Absent or cover them with approved unpaid leave. Resolve every missing date.","Preview September: A ₹30,000 and B ₹16,400. Finalize the test branch only after checking amounts; repeated finalization must not duplicate salary."],"result":"The finalized database snapshots total ₹46,400 and supply P&L Labor Cost once. They do not send bank payments. Final attendance/leave cannot be rewritten; rate changes require a future month effective date. Pending/rejected leave gives no pay credit."},"hinglish":{"scenario":"Test branch mein ek monthly aur ek daily-wage employee ki September salary nikalo. Pehle A ko same-branch login se link karo aur LEAVE_SELF do; attendance mark karne wale ke paas ATTENDANCE aur ALAG reviewer ke paas LEAVE_APPROVAL ho. Linked employee ya request submitter khud review nahi kar sakte, Owner bhi nahi.","steps":["PAYROLL access se A ko ON_ROLL ₹30,000 monthly aur B ko OFF_ROLL ₹800 daily par September 1 se banao. Completed September use karo, future month nahi.","A ke 29 Present mark karo; A ek din leave apply kare aur doosra authorized manager PAID approve kare. Weekly Off assume nahi hoga.","B ke 20 full Present aur ek Half Day mark karo; baaki eligible din Absent ya approved unpaid leave se cover karo. Har missing date resolve karo.","September preview mein A ₹30,000 aur B ₹16,400 check karo. Amounts dekhkar sirf test branch finalize karo; repeat finalization salary duplicate nahi karegi."],"result":"Real finalized snapshots ka total ₹46,400 hai aur P&L Labor Cost mein ek baar aata hai. Bank payment send nahi hoti. Final attendance/leave rewrite nahi hoti; rate change future month se hota hai. Pending/rejected leave se pay credit nahi milta."}},"/admin/users":{"en":{"scenario":"Give a new cashier access only to POS and Cash Drop in a test branch.","steps":["As Owner or an authorized Branch Admin, click New User. Use a test employee's name and an unused 10-digit mobile number you control.","Set a new private password of at least 12 characters, Role: CASHIER, and the intended branch. Never copy a password from a guide or chat.","Select only POS_CASHIER and CASH_DROP, then save. A Branch Admin can grant only permissions they already hold.","Sign in separately as the test user. The sidebar and Guide Book should show only permitted modules; direct forbidden URLs remain denied."],"result":"A real account is saved with branch/module restrictions. This is not a page-only demo; remove or disable the practice account after testing."},"hinglish":{"scenario":"Test branch ke naye cashier ko sirf POS aur Cash Drop access do.","steps":["Owner ya authorized Branch Admin se New User dabao. Test employee ka naam aur apne control wala unused 10-digit mobile number do.","Kam se kam 12-character ka naya private password set karo, Role: CASHIER aur sahi branch chuno. Guide/chat se password copy mat karo.","Sirf POS_CASHIER aur CASH_DROP tick karke save karo. Branch Admin wahi grants de sakta hai jo khud uske paas hain.","Alag session mein test user login karo. Sidebar aur Guide Book mein sirf permitted modules dikhne chahiye; forbidden direct URLs denied rahengi."],"result":"Branch/module restrictions wala real account save hota hai. Yeh page-only demo nahi; testing ke baad practice account disable/remove karo."}},"/admin/branches":{"en":{"scenario":"Owner adds a new practice branch without copying another branch's data.","steps":["As Owner, open Branches and click New Branch.","Code: PRACTICE7; Name: Practice Vasant Kunj; Address: Test address. Use a unique code.","Enter the branch's actual latitude/longitude and a geofence radius of 50 metres, then Save. Use a test branch rather than altering a real one.","Reload and find the new branch. Check the branch dropdown in Users & Access."],"result":"A real empty branch is saved and becomes selectable. Menus, recipes, users and stock are not cloned. Branch Admin can edit only their own branch and cannot create this new branch."},"hinglish":{"scenario":"Owner doosri branch ka data copy kiye bina nayi practice branch banaye.","steps":["Owner se Branches kholo aur New Branch dabao.","Code: PRACTICE7; Name: Practice Vasant Kunj; Address: Test address. Unique code lo.","Branch ke actual latitude/longitude aur 50 metre geofence radius bharo, phir Save karo. Real branch badalne ke bajaye test branch use karo.","Reload par nayi branch dekho aur Users & Access ke branch dropdown mein check karo."],"result":"Real, khali branch save hogi aur selectable banegi. Menu, recipes, users ya stock clone nahi hote. Branch Admin sirf apni branch edit kar sakta hai; yeh nayi branch create nahi kar sakta."}},"/admin/settings/whatsapp":{"en":{"scenario":"Owner connects provider configuration for a WhatsApp number they control.","steps":["In your own ChatXFlow account, connect your WhatsApp number through its QR flow.","As Owner, open WhatsApp Settings and paste the actual Developer API Token privately into the token field. Never paste it into chat or this guide.","Set your WhatsApp phone number, leave the approved base URL as https://chatxflow.online and click Save Settings.","Reload to confirm the saved configuration. When editing later, leave the token blank to retain the existing token."],"result":"Provider configuration is saved in the real database and token display is masked. Saving alone does not send a message or enable reminders, approvals, webhooks or the 8AM summary."},"hinglish":{"scenario":"Owner apne control wale WhatsApp number ki provider settings connect kare.","steps":["Apne ChatXFlow account mein QR flow se WhatsApp number connect karo.","Owner se WhatsApp Settings kholo aur actual Developer API Token privately token field mein paste karo. Chat ya guide mein kabhi paste mat karo.","Apna WhatsApp phone set karo, approved Base URL https://chatxflow.online hi rakho aur Save Settings dabao.","Reload karke saved configuration confirm karo. Baad mein token blank chhodne par existing token retain hota hai."],"result":"Provider settings real DB mein save hoti hain aur token masked dikhta hai. Sirf Save se message send, reminders, approvals, webhooks ya 8AM summary enable nahi hote."}},"/menu":{"en":{"scenario":"Build a 2-level recipe: a Semi-FG gravy made from raw materials, a dish that uses that gravy, then produce real Semi-FG stock before selling it.","steps":["Recipe Builder: name Practice Gravy, mark it Semi-FG, set branch, output unit kg, add one raw-material ingredient row (e.g. Tomato, batch quantity 0.3) and Save — this is one atomic save of the dish + its whole recipe.","Recipe Builder again: name Practice Curry (sellable dish), add a raw-material row plus a Semi-FG row picking Practice Gravy, and Save.","Open Practice Curry, click Preview stock & cost — confirm it shows the theoretical raw-cost rollup AND separately flags Practice Gravy as required-but-unavailable (shortage), since no Semi-FG stock has been produced yet.","In the Semi-FG production & stock panel, pick Practice Gravy, enter an output quantity and Record production — confirm Practice Gravy's stock on hand increases; Preview stock & cost on Practice Curry now shows it available, not a shortage."],"result":"A real recipe tree is saved in Postgres, with explicit output units and one atomic save per recipe. A Semi-FG only becomes real sellable stock after it is actually produced — production consumes its own raw ingredients once; selling the dish that references it then consumes the produced Semi-FG stock directly, never that raw ingredient again."},"hinglish":{"scenario":"2-level recipe banao: raw material se Semi-FG gravy, us gravy ko use karne wali dish, phir bechne se pehle real Semi-FG stock produce karo.","steps":["Recipe Builder: naam Practice Gravy, Semi-FG mark karo, branch aur output unit kg set karo, ek raw-material ingredient row add karo (jaise Tomato, batch quantity 0.3) aur Save karo — yeh dish + poori recipe ka ek atomic save hai.","Recipe Builder dobara: naam Practice Curry (sellable dish), ek raw-material row aur ek Semi-FG row (Practice Gravy chun kar) add karo, Save karo.","Practice Curry kholo, Preview stock & cost dabao — confirm karo theoretical raw-cost rollup ke saath Practice Gravy ko required-but-unavailable (shortage) flag kiya gaya hai, kyunki abhi koi Semi-FG stock produce nahi hua.","Semi-FG production & stock panel mein Practice Gravy chuno, output quantity daalo aur Record production dabao — confirm karo Practice Gravy ka stock badh gaya; ab Practice Curry par Preview stock & cost usey available dikhayega, shortage nahi."],"result":"Real recipe tree Postgres mein save hota hai, explicit output units aur har recipe ka ek atomic save ke saath. Semi-FG tabhi real sellable stock banta hai jab usey actually produce kiya jaaye — production uska apna raw ingredient ek baar consume karta hai; us Semi-FG ko reference karne wali dish bechne par phir produced Semi-FG stock directly consume hota hai, woh raw ingredient dobara kabhi nahi."}},"/warehouse":{"en":{"scenario":"Dispatch stock from Central to a branch, then confirm receipt with a deliberate shortfall.","steps":["As Owner, open Warehouse & Transfers and create a CENTRAL warehouse (if none exists) and a BRANCH warehouse for your test branch.","Click Dispatch Transfer: From Central, To your test branch, pick a raw material, Qty dispatched: 10.","Check Inventory for that branch — stock has NOT changed yet (dispatch is a paper record only).","Click Receive on the DISPATCHED row and enter Qty received: 9. Confirm the branch's Inventory now shows +9, and the transfer shows a 1-unit shortfall."],"result":"A real stock_transfers row moves DISPATCHED → RECEIVED, and branch inventory_stock only changes at the Receive step — proving dispatch alone never touches live stock, and variance is tracked, not silently dropped."},"hinglish":{"scenario":"Central se branch ko stock dispatch karo, phir jaan-boojh kar shortfall ke saath receive confirm karo.","steps":["Owner se Warehouse & Transfers kholo aur CENTRAL warehouse (agar na ho) + apni test branch ka BRANCH warehouse banao.","Dispatch Transfer dabao: From Central, To apni test branch, koi raw material chuno, Qty dispatched: 10.","Us branch ka Inventory check karo — stock abhi NAHI badla (dispatch sirf paper record hai).","DISPATCHED row par Receive dabao aur Qty received: 9 bharo. Confirm karo branch ki Inventory ab +9 dikhti hai, aur transfer mein 1-unit shortfall dikhta hai."],"result":"Real stock_transfers row DISPATCHED → RECEIVED move hoti hai, aur branch inventory_stock sirf Receive step par badalti hai — proof ki dispatch akela kabhi live stock nahi chhuta, aur variance track hoti hai, silently drop nahi hoti."}},"/gst-export":{"en":{"scenario":"Pull a GSTR-1 HSN summary for today covering orders you just placed via POS.","steps":["Place 1-2 real POS orders in a GST-configured branch (branch and company GST state codes both set).","Open GSTR-1 HSN Summary Export, set From/To to today, and optionally scope to that branch.","Click Generate — review the HSN-wise table: rate, qty, taxable value, CGST/SGST/IGST and total.","Click Export CSV and open the downloaded file; confirm its numbers match the on-screen table."],"result":"A real CSV is generated purely from the orders you just placed — no mock numbers. Orders from a branch without GST configured would show up in 'excluded' count instead of silently appearing as compliant."},"hinglish":{"scenario":"Aaj POS se lagaye orders ka GSTR-1 HSN summary nikaalo.","steps":["GST-configured branch mein (branch aur company dono ke GST state code set) 1-2 real POS orders lagao.","GSTR-1 HSN Summary Export kholo, From/To aaj ki date set karo, optional us branch tak scope karo.","Generate dabao — HSN-wise table dekho: rate, qty, taxable value, CGST/SGST/IGST aur total.","Export CSV dabao aur downloaded file kholo; confirm numbers on-screen table se milte hain."],"result":"Real CSV sirf abhi lagaye orders se banta hai — koi mock numbers nahi. GST-unconfigured branch ke orders 'excluded' count mein dikhenge, compliant jaisa silently nahi."}}};

let language="en", theme="light", openKey=null;
try { const l=localStorage.getItem("restaurant-guide-language"); if(["en","hinglish"].includes(l)) language=l; const th=localStorage.getItem("restaurant-guide-theme"); if(["light","dark","blue","emerald"].includes(th))theme=th;}catch{}
const el=id=>document.getElementById(id), tx=pair=>pair[language==="hinglish"?1:0];
function node(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n;}
function chapter(m){return language==="hinglish"?{...m,...m.hinglish}:m;}
function renderDetail(){if(!openKey)return;const base=MODULES.find(m=>m.module===openKey),m=chapter(base), target=el("detailContent");target.replaceChildren(node("div",m.route,"route"),node("h2",m.icon+" "+m.title),node("span",(m.status==="mixed"?tx(["Partly live","Kuch hissa real"]):tx(COPY[m.status==="live"?"live":"demo"])),"badge "+(m.status==="live"?"live":"demo")),node("h3",tx(COPY.what)),node("p",m.what),node("h3",tx(COPY.how)));const ul=node("ul","");m.how.forEach(s=>ul.append(node("li",s)));target.append(ul,node("h3",tx(["Try this example — step by step","Yeh example try karo — step by step"])));const ex=EXAMPLES[m.route]?.[language],box=node("section","","example");if(ex){box.append(node("p",ex.scenario));const steps=node("ol","");ex.steps.forEach(step=>steps.append(node("li",step)));box.append(steps,node("p",tx(["Expected result: ","Result kya hoga: "])+ex.result),node("small",tx(["Practice instructions only. Real-record steps should be tried in a test branch/account.","Sirf practice instructions. Real-record steps test branch/account mein try karo."])));}else{box.append(node("p",m.example));}target.append(box);}
function render(){document.documentElement.lang=language==="hinglish"?"hi-Latn":"en";document.documentElement.dataset.theme=theme;el("language").value=language;el("theme").value=theme;["subtitle","languageLabel","themeLabel","statusTitle","status","preferences","permissions","flowNote","footer","close"].forEach(id=>el(id).textContent=tx(COPY[id]));el("close").setAttribute("aria-label",tx(COPY.close));el("flow").replaceChildren();[tx(["Staff WhatsApp (planned workflows)","Staff WhatsApp (planned workflows)"]),"→","ChatXFlow API","→","Restaurant HQ ERP","→","PostgreSQL","→",tx(["Owner view","Owner view"])].forEach(s=>el("flow").append(node("span",s)));el("brandingTitle").textContent=tx(["Example: restaurant name and logo","Example: restaurant ka naam aur logo"]);el("brandingSteps").replaceChildren(...BRANDING_STEPS.map(s=>node("li",tx(s))));el("grid").replaceChildren();MODULES.forEach(base=>{const m=chapter(base),b=node("button","","card");b.type="button";const meta=node("div","","meta");meta.append(node("span",m.icon,"icon"),node("span",(m.status==="mixed"?tx(["Partly live","Kuch hissa real"]):tx(COPY[m.status==="live"?"live":"demo"])),"badge "+(m.status==="live"?"live":"demo")));b.append(meta,node("h3",m.title),node("div",tx(CATS[m.cat]),"category"),node("p",m.short),node("span",tx(COPY.tap),"tap"));b.onclick=()=>{openKey=m.module;renderDetail();el("detail").showModal();};el("grid").append(b);});renderDetail();}
el("language").onchange=e=>{language=e.target.value;try{localStorage.setItem("restaurant-guide-language",language)}catch{}render();};el("theme").onchange=e=>{theme=e.target.value;try{localStorage.setItem("restaurant-guide-theme",theme)}catch{}render();};el("close").onclick=()=>el("detail").close();el("detail").addEventListener("close",()=>{openKey=null;});render();
